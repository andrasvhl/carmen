# Drop-in for this one instance of automation@.service. The template's 600 s
# kills a oneshot mid-run, and this job can legitimately take longer: up to
# 15 min waiting for build_brief's model turn, a 15 min model turn of its own,
# and up to 3 job re-runs of 3 min each. Install to
# /etc/systemd/system/automation@maintenance_brief.service.d/timeout.conf
[Service]
TimeoutStartSec=3000
