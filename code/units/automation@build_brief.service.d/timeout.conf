# Drop-in for this one instance of automation@.service. The template's 600 s
# kills a oneshot mid-run, and the model turn alone may take up to 1500 s
# (ASK_TIMEOUT in jobs/build_brief.py), plus the vault pull and push around it.
# Install to /etc/systemd/system/automation@build_brief.service.d/timeout.conf
[Service]
TimeoutStartSec=1800
