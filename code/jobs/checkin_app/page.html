    if (op === "wedit") {
      editWait = id; editDraft = null; render();
      const el = document.querySelector(`.dwait[data-id="${CSS.escape(id)}"] .in-wait`);
      if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
      return;
    }
    if (op === "nudge") {
      const w = ((view.do && view.do.waiting) || []).find(x => x.id === id) || {};
      openChat({kind: "task", id, title: w.title || id, tab: "do", from: "nudge",
                send: `No answer yet on: ${w.who || "the wait"}. Draft a short, friendly follow-up for me to send.`});
      return;
    }
    if (op === "waittoggle") {
      // Waiting is one button (owner decision, Nov 3): pressed, the reason field opens in the card and
      // nothing moves; Save sends it to the Waiting fold; pressed again before Save, it cancels.
      pendingWait = pendingWait && pendingWait.id === id ? null : {id, text: stepBtn.dataset.guess || ""};
      render();
      const el = document.querySelector(`.doitem[data-id="${CSS.escape(id)}"] .in-wait-new`);
      if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
      return;
    }
    if (op === "waitsave") {
      const el = holder.querySelector(".in-wait-new"), text = el ? el.value.trim() : "";
      if (!text) { if (el) el.focus(); return; }
      pendingWait = null;
      const wr = findRow(id), more = wr && wr.detail && (wr.detail.steps || []).length;
      if (!more) openWaitFold = true;
      const undo = doLocal(d => { if (!more) doWaitRow(d, id, text); });
      haptic(); doTap({id, action: "set_waiting", text}, undo);
      return;
    }
    if (op === "notwait") {
      const undo = doLocal(d => { d.waiting = (d.waiting || []).filter(x => x.id !== id); });
      haptic(); lastStep = null; doTap({id, action: "not_waiting"}, undo);
      return;
    }
    if (op === "finish") {   // Close task on the flipped card (Nov 8): the rest is struck, not ticked
      stepBtn.disabled = true;
      try {
        await api("api/act", {id, action: "task_finish", tab});
        haptic(); flipSet(id, {closed: true, state: "done"}); render(); load();
      } catch (e) { stepBtn.disabled = false; toast("Failed: " + e.message); }
      return;
    }
    stepBtn.disabled = true;
    try {
      await api("api/act", {id, action: op === "undo" ? "step_undo" : "not_waiting"});
      haptic(); lastStep = null; delete flips[id]; load();
    } catch (e) { stepBtn.disabled = false; toast("Failed: " + e.message); }
    return;
  }
  const fb = t.closest("[data-fold]");
  if (fb) { fold = fold === fb.dataset.fold ? null : fb.dataset.fold; render(); return; }
  if (t.id === "go-live") {
    ev.preventDefault();
    const go = () => { testMode = false; store("checkin-live", "1"); render(); };
    if (inTg) tg.showConfirm("Go live? Taps will change your real tasks.", ok => ok && go());
    else if (confirm("Go live? Taps will change your real tasks.")) go();
    return;
  }
  if (t.id === "go-test") { ev.preventDefault(); testMode = true; store("checkin-live", "0"); render(); return; }
  if (t.id === "go-live" || t.id === "go-test") sel._init = false;
  if (t.id === "add-open") { document.getElementById("addbar").classList.toggle("on"); document.getElementById("new-task").focus(); return; }
  if (t.id === "add-btn") {
    const inp = document.getElementById("new-task");
    if (!inp.value.trim()) return;
    try {
      const res = await api("api/act", {action: "add", text: inp.value}); haptic(); inp.value = ""; toast(res.msg);
      if (!testMode) load();
    }
    catch (e) { toast("Failed: " + e.message); }
    return;
  }
  const ansBtn = t.closest("button[data-answer]");
  if (ansBtn) {
    const card = ansBtn.closest("[data-id]"), box = ansBtn.closest(".ask");
    const answer = ansBtn.dataset.answer || box.querySelector(".in-answer").value.trim();
    if (!answer) return;
    ansBtn.disabled = true;
    try { const res = await api("api/act", {id: card.dataset.id, action: "answer", q: box.dataset.q, text: answer}); haptic(); toast(res.msg); load(); }
    catch (e) { ansBtn.disabled = false; toast("Failed: " + e.message); }
    return;
  }
  const olb = t.closest("button[data-old]");
  if (olb && olb.closest("[data-id]")) {
    const card = olb.closest("[data-id]"), how = olb.dataset.old, id = card.dataset.id;
    olb.disabled = true;
    try {
      const res = await api("api/act", how === "keep" ? {id, action: "cleanup_keep", tab} : {id, action: "cleanup_close", how, tab});
      if (res.msg) toast(res.msg);
      view.cleanup = (view.cleanup || []).map(c => c.task !== id ? c : (res.state === "cleanup" ? Object.assign({}, c, {old: false}) : null)).filter(Boolean);
      render();
    } catch (e) { olb.disabled = false; toast("Failed: " + e.message); }
    return;
  }
  const clb = t.closest("button[data-clean]");
  if (clb && clb.closest("[data-id]")) {
    const card = clb.closest("[data-id]");
    clb.disabled = true;
    try { const res = await api("api/act", {id: card.dataset.id, action: clb.dataset.clean === "apply" ? "cleanup_apply" : "cleanup_skip", tab}); if (res.msg) toast(res.msg); view.cleanup = (view.cleanup || []).filter(c => c.task !== card.dataset.id); render(); }
    catch (e) { clb.disabled = false; toast("Failed: " + e.message); }
    return;
  }
  const acb = t.closest("button[data-actual]");
  if (acb && acb.closest("[data-sid]")) {
    const box = acb.closest("[data-sid]");
    try { await api("api/act", {id: box.dataset.id, action: "actual_check", sid: box.dataset.sid, answer: acb.dataset.actual, tab}); box.remove(); }
    catch (e) { toast("Failed: " + e.message); }
    return;
  }
  const ocb = t.closest("button[data-outcome]");
  if (ocb && ocb.closest("[data-id]")) {
    const card = ocb.closest("[data-id]"), txt = window.prompt("Today's outcome", ocb.dataset.outcome);
    if (txt === null) return;
    try { await api("api/act", {id: card.dataset.id, action: "do_outcome", text: txt, tab}); load(); }
    catch (e) { toast("Failed: " + e.message); }
    return;
  }
  const bxb = t.closest("button[data-box]");
  if (bxb && bxb.closest("[data-id]")) {
    const card = bxb.closest("[data-id]");
    bxb.disabled = true;
    try { const res = await api("api/act", {id: card.dataset.id, action: "step_box", sid: bxb.dataset.box, tab}); if (res.msg) toast(res.msg); load(); }
    catch (e) { bxb.disabled = false; toast("Failed: " + e.message); }
    return;
  }
  const shb = t.closest("button[data-sharpen]");
  if (shb && shb.closest("[data-id]")) {
    const card = shb.closest("[data-id]");
    // The step contract (Tasks v2, Nov 6): an unclear step goes to the task chat to be sharpened.
    fbOpen = card.dataset.id + "|" + card.dataset.sid; render();
    return;
  }
  const vtb = t.closest("button[data-vote]");
  if (vtb && vtb.closest("[data-sid]")) {
    const box = vtb.closest("[data-sid]"), k = box.dataset.id + "|" + box.dataset.sid, d = fbDraft[k], code = vtb.dataset.code, v = vtb.dataset.vote;
    if (code === "_est") d.est.vote = d.est.vote === v ? "" : v; else d.votes[code] = d.votes[code] === v ? "" : v;
    render();
    return;
  }
  const fbb = t.closest("button[data-fb]");
  if (fbb && fbb.closest("[data-sid]")) {
    const box = fbb.closest("[data-sid]"), id = box.dataset.id, sid = box.dataset.sid, k = id + "|" + sid, d = fbDraft[k] || {votes: {}, est: {}, note: ""};
    const c = (view.review || []).find(x => x.task === id && x.sid === sid) || {}, how = fbb.dataset.fb;
    if (how === "close") { fbOpen = ""; render(); return; }   // the draft stays for next time
    const votes = Object.fromEntries(Object.entries(d.votes).filter(([, v]) => v));
    if (how === "fine") (c.explain || []).forEach(e => { votes[e.code] = "wrong"; });
    const est = {vote: d.est.vote || "", min: d.est.min ? Number(d.est.min) : null};
    if (how !== "fine" && how !== "notatask" && !Object.keys(votes).length && !est.vote && !est.min && !(d.note || "").trim()) {
      const err = box.querySelector(".fberr"); if (err) err.hidden = false;
      return;
    }
    fbb.disabled = true;
    try {
      await api("api/act", {id, action: "step_feedback", sid, votes, est, note: d.note || "", verdict: how, tab});
      view.review = (view.review || []).filter(x => !(x.task === id && x.sid === sid)); delete fbDraft[k]; fbOpen = ""; render();
      toast(how === "fine" ? "Marked fine" : how === "notatask" ? "Step removed" : "Feedback saved");
      if (how === "notatask") { await api("api/act", {id, action: "step_discard", sid, text: c.next || "", tab}); load(); }
      if (how === "rewrite") {
        const r = findRow(id), wrong = (c.explain || []).filter(e => votes[e.code] !== "wrong").map(e => e.title);
        openChat({kind: "task", id, title: r ? r.title : id, row: r, tab, from: "sharpen",
                  send: "Sharpen the Next step so it keeps the step contract" + (wrong.length ? " (" + wrong.join("; ") + ")" : "") + ": "
                        + stripDue(clean(c.next || "")) + (d.note ? "\nMy note: " + d.note : "") + (est.min ? "\nIt takes me about " + est.min + " min." : "")});
      }
    } catch (e) { fbb.disabled = false; toast("Failed: " + e.message); }
    return;
  }
  const fnb = t.closest("button[data-fine]");
  if (fnb && fnb.closest("[data-sid]")) {
    const box = fnb.closest("[data-sid]");
    fnb.disabled = true;
    try { await api("api/act", {id: box.dataset.id, action: "step_fine", sid: box.dataset.sid, tab}); toast("Marked fine");
          view.review = (view.review || []).filter(c => !(c.task === box.dataset.id && c.sid === box.dataset.sid)); render(); }
    catch (e) { fnb.disabled = false; toast("Failed: " + e.message); }
    return;
  }
  if (t.closest("button[data-reviewall]")) { reviewAll = true; render(); return; }
  const crb = t.closest("button[data-crate]");
  if (crb && crb.closest("[data-cid]")) { cOpen = crb.closest("[data-cid]").dataset.cid; render(); return; }
  const cvb = t.closest("button[data-cvote]");
  if (cvb && cvb.closest("[data-cid]")) {
    const d = cDraft[cvb.closest("[data-cid]").dataset.cid], code = cvb.dataset.ccode, v = cvb.dataset.cvote;
    d.votes[code] = d.votes[code] === v ? "" : v; render();
    return;
  }
  const cfb = t.closest("button[data-cfb]");
  if (cfb && cfb.closest("[data-cid]")) {
    const box = cfb.closest("[data-cid]"), task = box.dataset.cid, how = cfb.dataset.cfb;
    if (how === "close") { cOpen = ""; render(); return; }
    const c = (view.chunk_review || []).find(x => x.task === task) || {}, d = cDraft[task] || {votes: {}, outcome: "", min: "", note: ""};
    const votes = Object.fromEntries(Object.entries(d.votes).filter(([, v]) => v));
    if (how !== "fine" && how !== "notatask" && !Object.keys(votes).length && !d.outcome.trim() && !d.min && !d.note.trim()) {
      const err = box.querySelector(".fberr"); if (err) err.hidden = false;
      return;
    }
    cfb.disabled = true;
    try {
      await api("api/act", {id: task, action: "do_chunk_feedback", verdict: how, votes, outcome: d.outcome || "", min: d.min ? Number(d.min) : null,
                            note: d.note || "", shown: {outcome: c.outcome, his: c.his, min: c.min, steps: (c.steps || []).map(x => x.text)}, tab});
      view.chunk_review = (view.chunk_review || []).filter(x => x.task !== task); delete cDraft[task]; cOpen = ""; render();
      toast(how === "fine" ? "Marked fine" : how === "notatask" ? "Taken off today" : "Feedback saved");
      if (how === "notatask") { await api("api/act", {id: task, action: "do_drop", tab}); load(); }
    } catch (e) { cfb.disabled = false; toast("Failed: " + e.message); }
    return;
  }
  const btn = t.closest("button[data-a]");
  const card = t.closest("[data-id]");
  if (!card) return;
  const skipUi = t.closest("button[data-skipui]");   // Skip's two choices open in the card (Nov 9)
  if (skipUi) {
    const open = skipUi.dataset.skipui === "open", acts = card.querySelector(".acts"), box = card.querySelector(".skipchoice");
    if (box) box.remove();
    if (acts) { acts.style.display = open ? "none" : ""; if (open) acts.insertAdjacentHTML("afterend", skipChoice()); }
    return;
  }
  if (!btn) {
    if (card.classList.contains("item") && !t.closest(".edit") && !t.closest(".pl-detf") && !t.closest(".fbpanel") && !t.closest(".removebox") && !t.closest(".dwho") && !t.closest(".in-wait")) setOpen(card, !card.classList.contains("open"));
    return;
  }
  let action = btn.dataset.a, text = "", extra = {};
  if (action === "edit") {
    openEdit(card);
    api("api/act", {id: card.dataset.id, action: "mark", signal: tab === "claude" ? "claude_adjust" : "edit_opened"}).catch(() => {});
    return;
  }
  if (action === "start") {
    const r = doRow(card.dataset.id), has = !!(view.chats && view.chats["task:" + card.dataset.id]);
    // His to write (Nov 9): the panel opens at once and Carmen asks there (Nov 11), never on the card.
    openTaskPanel(card.dataset.id, btn.dataset.quiet ? "quiet" : (r && !has && isReflective(r) ? "ask" : undefined)); return;
  }
  if (action === "stepdone") {
    // Done on Do closes today's chunk (Nov 8; one step before): the server ticks the Next step and
    // each following step of the chunk, and says what follows. One Undo puts them all back.
    const r = findRow(card.dataset.id), id = card.dataset.id;
    const chunk = ((r && r.chunk && r.chunk.ids) || []).filter(Boolean);
    const idx = Math.max(0, ((view.do && view.do.rows) || []).findIndex(x => x.id === id));
    btn.disabled = true; card.classList.add("pending"); haptic();
    try {
      const res = await api("api/act", {id, action: "step_done", tab, over: r && r.wait_back ? 1 : 0, chunk});
      if (testMode) { btn.disabled = false; card.classList.remove("pending"); toast(res.msg); return; }
      if (tab === "do") {
        flipSet(id, {title: r ? r.title : id, state: res.state, closed: res.state === "done", who: res.who || "", next: res.next || "", idx});
        render(); setTimeout(load, 0);
        return;
      }
      lastStep = {id, title: r ? r.title : id, state: res.state, who: res.who || "",
                  next: res.next || "", guess: res.guess || "", until: Date.now() + STEP_SHOW_MS};
      setTimeout(() => { if (lastStep && Date.now() >= lastStep.until) { lastStep = null; render(); } }, STEP_SHOW_MS + 100);
      doLocal(d => {
        const row = d.rows.find(x => x.id === id);
        if (res.state === "waiting") doWaitRow(d, id, res.who || "");
        else if (res.state === "done") { d.rows = d.rows.filter(x => x.id !== id); if (row) d.done = [row].concat(d.done || []); }
        else if (row) { row.next = res.next || ""; row.next_short = ""; }
      });
      setTimeout(load, 0);
    } catch (e) { btn.disabled = false; card.classList.remove("pending"); toast("Failed: " + e.message); }
    return;
  }
  if (action === "talk" || action === "letclaude") {
    // Chat in the app instead of Telegram (Oct 31). Let Claude sends its request at once, as before.
    const r = findRow(card.dataset.id);
    openChat({kind: "task", id: card.dataset.id, title: r ? r.title : (card.querySelector(".title") || {}).textContent, row: r,
              tab: action === "letclaude" ? "claude" : tab, from: action,
              send: action === "letclaude" ? "Please do these now, as far as you can, and update the task: " + (r && r.prep ? r.prep.join("; ") : "") : undefined});
    return;
  }
  if (action === "sendopen") { openSend(card); return; }
  if (action === "skipreply" || action === "skipreply_undo") {
    const id = card.dataset.id, r = findRow(id);
    card.querySelectorAll("button").forEach(b => b.disabled = true);
    try {
      const res = await api("api/act", {id, action, how: btn.dataset.how || ""});
      haptic();
      if (testMode || res.keep) { toast(res.msg, true); card.querySelectorAll("button").forEach(b => b.disabled = false); return; }
      if (action === "skipreply") {
        replyUndo = {id, title: r ? ((r.draft && r.draft.to) || r.title) : id, msg: res.msg || "Skipped", until: Date.now() + REPLY_UNDO_MS};
        setTimeout(() => { if (replyUndo && Date.now() >= replyUndo.until) { replyUndo = null; render(); } }, REPLY_UNDO_MS + 100);
        card.classList.add("gone");
      } else { replyUndo = null; toast(res.msg, true); }
      setTimeout(load, 380);
    } catch (e) { card.querySelectorAll("button").forEach(b => b.disabled = false); toast("Failed: " + e.message); }
    return;
  }
  if (action === "copy" || action === "wa") {
    // WhatsApp and the other chats stay copy-only: he sends them himself (Oct 31). The text is
    // the card's, edited or not; WhatsApp opens the chat with it filled in.
    const r = findRow(card.dataset.id), ta = card.querySelector(".in-draft");
    const text = ta ? ta.value : ((r && r.draft && r.draft.body) || "");
    if (action === "wa") {
      const url = "https://wa.me/" + waNumber(r.draft.to) + "?text=" + encodeURIComponent(text);
      if (inTg && tg.openLink) tg.openLink(url); else window.open(url, "_blank");
    } else if (await copyText(text)) {
      haptic(); const was = btn.textContent; btn.textContent = "Copied";
      setTimeout(() => { btn.textContent = was; }, 1500);
    } else { toast("Failed: could not copy"); return; }
    api("api/act", {id: card.dataset.id, action: "mark", signal: "reply_copied", text, wa: action === "wa"}).catch(() => {});
    return;
  }
  if (action === "details") { setOpen(card, !card.classList.contains("open")); btn.setAttribute("aria-expanded", card.classList.contains("open")); return; }
  if (action === "removeopen") { card.classList.remove("editing"); openPop(btn, card); return; }
  if (action === "remove") extra = {reason: btn.dataset.reason, why: card.querySelector(".in-why").value};
  if (action === "swap") extra = {previous: view[day].one ? view[day].one.id : ""};
  if (action === "select" || action === "unselect") {
    // Live: the selection and the budget change at once; the server follows.
    const id = card.dataset.id, before = sel[day].slice();
    sel[day] = action === "select" ? (sel[day].includes(id) ? sel[day] : sel[day].concat(id)) : sel[day].filter(i => i !== id);
    // One day at a time (Nov 10, r3 S2): selecting for one day takes it out of the other's selection.
    const other = day === "today" ? "tomorrow" : "today";
    const moves = action === "select" && tab === "today" && day === "tomorrow" && (onDoToday(id) || sel.today.includes(id)) ? [id] : [];
    moves.forEach(i => plMoved.add(i));
    if (action === "select" && tab === "today") sel[other] = sel[other].filter(i => i !== id);
    render(); haptic();
    // A task dated later comes to the day shown (Nov 10): said, with Undo (take-out puts the date back).
    const prow = action === "select" && tab === "today" ? planPool(day).find(x => x.id === id) : null, pli = prow ? laterIso(prow, day) : "";
    if (pli && !moves.length) toastUndo(`Moved from ${new Date(pli + "T12:00").toLocaleDateString("en-US", {weekday: "short"})} to ${day === "today" ? "today" : dayWord(day)}`, async () => {
      sel[day] = sel[day].filter(i => i !== id); render();
      await api("api/act", {id, action: "unselect", from}); if (!testMode) load();
    });
    // The move off today's Do is said where he looks, with Undo (UI r3).
    if (moves.length) toastUndo(`Added${planMoveWords(moves)}`, async () => {
      sel.tomorrow = sel.tomorrow.filter(i => i !== id); render();
      await api("api/act", {id, action: "unselect", from}); if (!testMode) load();
    });
    const secEl = card.closest("[data-sec]"), from = card.classList.contains("hero") ? "one" : (secEl ? secEl.dataset.sec : "");
    try { const res = await api("api/act", {id, action, from}); if (!testMode) load(); else if (res.msg) toast(res.msg); }
    catch (e) { sel[day] = before; render(); toast("Failed: " + e.message); }
    return;
  }
  if (action === "replied") text = (card.querySelector(".in-draft") || {}).value || "";
  if (action === "next") text = card.querySelector(".in-next").value;
  if (action === "note" || action === "talknote") text = card.querySelector(".in-note").value;
  if (["next", "note", "talknote"].includes(action) && !text.trim()) return;
  if (action === "talknote") action = "talk";
  const buttons = card.querySelectorAll("button");
  buttons.forEach(b => b.disabled = true);
  try {
    const res = await api("api/act", {id: card.dataset.id, action, text, ...extra});
    haptic(); toast(res.msg, action === "tomorrow" || action === "remove");   // Not now said nothing (QA Nov 8)
    if (res.close && inTg) { tg.close(); return; }
    if (testMode || res.keep || res.close) {
      buttons.forEach(b => b.disabled = false);
      card.classList.remove("editing");
      if (!testMode) load();
      return;
    }
    card.classList.add("gone");
    setTimeout(load, 380);
  } catch (e) {
    buttons.forEach(b => b.disabled = false);
    toast("Failed: " + e.message);
  }
});

render();
paintOffq();
load(true);
// The Goals tab lives in its own file (Nov 5): jobs/checkin_app/goals.js.
(function () { const s = document.createElement("script"); s.src = base + "goals.js"; document.body.appendChild(s); })();
</script>
</body>
</html>
