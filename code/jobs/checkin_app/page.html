<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carmen</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#F5F4F0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Carmen">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Design: the approved mock, Oct 30. */
  :root {
    --ground: #F5F4F0; --surface: #FFFFFF; --ink: #17171C; --ink2: #3A3A42; --muted: #5E5E66;
    --line: #EEEDE8; --soft: #F1F0EC; --accent: #2D4FD8; --accent-ink: #1F3AA8; --accent-soft: #EEF1FD;
    --amber-soft: #FBEFDF; --amber-ink: #8F4E08; --onaccent: #FFFFFF; --bar: rgba(255,255,255,.92);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #0F0F12; --surface: #1C1C21; --ink: #F2F2F5; --ink2: #D4D4DA; --muted: #A0A0A8;
      --line: #2A2A30; --soft: #2A2A30; --accent: #6F8BFF; --accent-ink: #A9B9FF; --accent-soft: #1E2547;
      --amber-soft: #3A2A12; --amber-ink: #F3C46B; --onaccent: #0F0F12; --bar: rgba(28,28,33,.92);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--ground); color: var(--ink);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, system-ui, sans-serif; }
  main { max-width: 560px; margin: 0 auto;
    padding: calc(16px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom)); }
  button { font: inherit; border: 0; cursor: pointer; }
  button.link { background: none; border: 0; padding: 0; height: auto; color: var(--accent); font: inherit; font-weight: 600; cursor: pointer; }
  /* iPhone: no double-tap zoom on taps, and 16px fields so focusing one never zooms */
  html, button, a, .item { touch-action: manipulation; }
  input, textarea { font-size: 16px !important; }
  button:disabled { opacity: .45; cursor: default; }

  .head { padding: 8px 4px 12px; display: flex; flex-direction: column; gap: 2px; }
  .head .sub { font-size: 13px; color: var(--muted); font-weight: 500; }
  .head .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  h1 { margin: 0; font-size: 32px; font-weight: 700; letter-spacing: -.02em; }
  h2 { margin: 18px 4px 8px; font-size: 15px; font-weight: 600; display: flex; justify-content: space-between; align-items: baseline; }
  h2 span { font-size: 13px; color: var(--muted); font-weight: 400; flex: 1; margin-left: 8px; }
  h2 .pill { height: 34px; }
  .pill { height: 40px; padding: 0 12px; border-radius: 12px; background: var(--surface); color: var(--accent);
    font-weight: 500; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }

  .banner { font-size: 13px; padding: 9px 12px; border-radius: 12px; margin: 0 0 12px; background: var(--surface); color: var(--muted); }
  .banner.test { background: var(--amber-soft); color: var(--amber-ink); }
  .banner a { color: var(--accent); font-weight: 600; text-decoration: none; }

  .card { background: var(--surface); border-radius: 18px; padding: 14px 16px; margin-bottom: 10px; }
  .hero { border-radius: 20px; padding: 18px; box-shadow: 0 1px 2px rgba(23,23,28,.06), 0 8px 24px rgba(23,23,28,.06); }
  .tag { display: inline-block; font-size: 11.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
    padding: 4px 8px; border-radius: 6px; background: var(--amber-soft); color: var(--amber-ink); }
  .tagline { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .title { font-weight: 600; line-height: 1.3; }
  .hero .title { font-size: 20px; letter-spacing: -.01em; margin-top: 10px; }
  .next { font-size: 14.5px; color: var(--ink2); margin-top: 6px; }
  .next b { color: var(--muted); font-weight: 400; }
  .why { font-size: 13px; color: var(--muted); margin-top: 8px; }
  .src { color: var(--muted); font-size: 12px; }
  .ask { background: var(--ground); border-radius: 12px; padding: 10px 12px; margin-top: 6px; }
  .askq { font-weight: 600; font-size: 14.5px; }
  .askopts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .askopts .addpill { width: auto !important; max-width: 100%; height: auto !important; min-height: 36px; border-radius: 10px !important; padding: 7px 12px !important; font-size: 14px !important; line-height: 1.3 !important; white-space: normal !important; text-align: left; }
  .askfree { display: flex; gap: 6px; margin-top: 8px; }
  .askfree input { flex: 1; min-width: 0; background: var(--surface); }
  .askfree .addpill { width: auto !important; border-radius: 10px !important; padding: 0 14px !important; font-size: 14px !important; }
  .waitbox { margin-top: 8px; background: var(--accent-soft); color: var(--accent-ink); border-radius: 10px; padding: 8px 10px; font-size: 13.5px; }
  .acts { display: flex; gap: 8px; margin-top: 12px; }
  .acts button { height: 44px; border-radius: 12px; padding: 0 14px; font-weight: 600; font-size: 14.5px; background: var(--soft); color: var(--ink); }
  .acts .primary { background: var(--accent); color: var(--onaccent); flex: 1; }
  .acts .soft { background: var(--accent-soft); color: var(--accent); }

  .list { background: var(--surface); border-radius: 18px; overflow: hidden; }
  .item { padding: 13px 16px; border-bottom: 1px solid var(--line); }
  .item:last-child { border-bottom: 0; }
  .item .top { display: flex; gap: 12px; align-items: flex-start; }
  .check { width: 26px; height: 26px; border-radius: 13px; border: 1.75px solid #B9B8B2; background: transparent; flex: none; margin-top: -1px; }
  .check:active { background: var(--accent-soft); }
  .item .body { flex: 1; min-width: 0; }
  .item .title { font-size: 15px; font-weight: 550; }
  .item .nx { font-size: 13px; color: var(--muted); margin-top: 2px; overflow-wrap: anywhere; }
  .item .est { font-size: 12px; color: var(--muted); flex: none; margin-top: 2px; }
  .item .more { display: none; }
  .item.open .more { display: block; }

  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 2px 0; }
  .chips button { height: 36px; border-radius: 10px; padding: 0 12px; font-size: 13px; font-weight: 500; background: var(--soft); color: var(--ink); }
  .chips button.on { background: var(--accent-soft); color: var(--accent); }

  .who { display: flex; align-items: center; gap: 10px; }
  .avatar { width: 36px; height: 36px; border-radius: 18px; background: var(--accent-soft); color: var(--accent-ink);
    font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex: none; }
  .who .name { font-weight: 600; }
  .who .via { font-size: 12.5px; color: var(--muted); }
  textarea.draft { display: block; width: 100%; box-sizing: border-box; border: 0; resize: vertical; font: inherit; font-size: 16px; min-height: 90px; }
  .draft { margin-top: 10px; background: var(--ground); border-radius: 12px; padding: 10px 12px; font-size: 14.5px; color: var(--ink2); white-space: pre-wrap; }
  .steps { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .steps .lbl { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .step { display: flex; gap: 8px; font-size: 14px; color: var(--ink2); }
  .step i { font-style: normal; width: 20px; height: 20px; border-radius: 10px; background: var(--accent-soft); color: var(--accent-ink);
    font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex: none; margin-top: 1px; }

  .edit { display: none; margin-top: 10px; }
  .editing .edit { display: block; }
  .edit label { font-size: 12px; color: var(--muted); display: block; margin: 8px 0 4px; }
  input, textarea { width: 100%; border: 0; border-radius: 12px; padding: 10px 12px; font: inherit; background: var(--ground); color: var(--ink); }
  textarea { min-height: 72px; resize: vertical; }
  .addbar { display: none; gap: 8px; margin-bottom: 12px; }
  .addbar.on { display: flex; }
  .addbar input { background: var(--surface); }
  .addbar button { height: 44px; padding: 0 16px; border-radius: 12px; background: var(--accent); color: var(--onaccent); font-weight: 600; }

  .seg { display: flex; background: var(--soft); border-radius: 12px; padding: 3px; margin: 0 0 12px; }
  .seg button { flex: 1; height: 38px; border-radius: 9px; background: none; color: var(--muted); font-weight: 600; font-size: 14px; }
  .seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(23,23,28,.12); }
  .cta { display: flex; justify-content: center; align-items: center; gap: 8px; width: 100%; height: 52px; margin-top: 16px;
    border-radius: 14px; background: var(--ink); color: var(--ground); font-weight: 600; font-size: 15.5px; }
  .plist .item .check { display: none; }
  .addpill { flex: none; height: 36px; padding: 0 14px; border-radius: 10px; background: var(--accent-soft); color: var(--accent);
    font-weight: 600; font-size: 13.5px; align-self: center; }
  .addpill.on, .acts .primary.on { background: var(--accent); color: var(--onaccent); }
  .addpill.ghost, .acts .primary.ghost { background: var(--soft); color: var(--ink); }
  .pair { display: flex; gap: 6px; flex: none; align-self: center; }
  .addpill .ico { display: none; }
  @media (max-width: 600px) {
    .pair { flex-direction: column; gap: 6px; align-self: flex-start; }
    .addpill { width: 40px; height: 40px; padding: 0; border-radius: 20px; font-size: 20px; line-height: 40px; }
    .addpill .lbl { display: none; }
    .addpill .ico { display: inline; }
    /* Done / Not done have no icon: small text chips, not 40 px circles (Oct 31) */
    .addpill.txt { width: auto; height: 34px; padding: 0 12px; border-radius: 17px; font-size: 14px; line-height: 34px; white-space: nowrap; }
    .item .top { gap: 10px; }
    /* 3 lines: as tall as the two stacked buttons, so the card wastes no space (Oct 30) */
    .item:not(.open) .nx { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  }
  /* Each row its own card, close together (Oct 30: "more card like without taking a lot more space") */
  .list { background: none; border-radius: 0; overflow: visible; display: flex; flex-direction: column; gap: 6px; }
  .item { background: var(--surface); position: relative; touch-action: pan-y pinch-zoom; border-radius: 14px;
    border: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 11px 14px;
    box-shadow: 0 1px 2px rgba(23,23,28,.05); }
  .item:last-child { border-bottom: 1px solid var(--line); }
  /* iOS Safari only sends taps on plain elements to a document listener when they look clickable */
  .item, [data-id], .item .top, .item .body { cursor: pointer; }
  .item.sw-add { background: var(--accent-soft); }
  .item.sw-rem { background: var(--amber-soft); }
  .item.sw-go.sw-add { background: #C9D3FA; }
  .item.sw-go.sw-rem { background: #F6D9B4; }
  .detail { margin-top: 10px; }
  /* Open card: the next step stays at the top in full, beside the buttons (no gap there),
     then the actions, then the details without a second copy of it (Oct 30) */
  .item .detail .dsec.dnext { display: none; }
  .item .more > .acts.small:first-child { margin-top: 10px; }
  .hero .detail { display: none; }
  .hero.open .detail { display: block; }
  .dgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 12px;
    background: var(--ground); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
  .dgrid label, .dsec label { display: block; font-size: 11.5px; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: .04em; margin-bottom: 1px; }
  .dsec { margin-top: 10px; font-size: 14px; color: var(--ink2); }
  .dsec .desc { white-space: pre-wrap; }
  .by { font-size: 11px; font-weight: 600; color: var(--accent); background: var(--accent-soft); padding: 2px 6px; border-radius: 5px; vertical-align: 2px; }
  .acts.small { margin-top: 8px; }
  .acts.small button { height: 36px; font-size: 13.5px; font-weight: 500; }
  .item .removebox { margin-top: 10px; }
  .item.removing .removebox { display: block; }
  /* Sticky, so the budget stays in view while scrolling (owner decision, Oct 30) */
  .bwrap { position: sticky; top: 0; z-index: 5; margin: 0 -16px 12px; padding: calc(8px + env(safe-area-inset-top)) 16px 8px;
    background: var(--ground); }
  .budget { background: var(--surface); border-radius: 14px; padding: 10px 14px; box-shadow: 0 6px 16px rgba(23,23,28,.08); }
  .budget .brow { display: flex; justify-content: space-between; font-size: 13.5px; }
  .budget .brow span { color: var(--muted); }
  .budget .bar { height: 6px; border-radius: 3px; background: var(--soft); margin-top: 8px; overflow: hidden; }
  .budget .bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .25s; }
  .budget.over .bar i { background: #C9771E; }
  .budget .bnote { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .budget.over .bnote:last-child { color: var(--amber-ink); font-weight: 600; }
  .removebox { display: none; margin-top: 10px; }
  .removing .removebox { display: block; }
  /* Remove as a vertical dropdown (owner decision, Oct 30) */
  .pop { position: fixed; z-index: 50; }
  /* Feel (Oct 30, "like Things 3"): things give way under the finger and move with a spring */
  button, .item, .card { transition: transform .14s cubic-bezier(.2,.8,.2,1), background-color .15s; }
  button:active:not(:disabled) { transform: scale(.94); }
  /* No press scale on cards: iOS marks every scroll touch as a press, so cards bounced while reading (Oct 30) */
  .pop.sheet { animation: sheetup .32s cubic-bezier(.2,.9,.25,1.05); }
  .pop.dialog { animation: popin .22s cubic-bezier(.2,.9,.3,1.1); }
  .pop.full { animation: fullin .28s cubic-bezier(.2,.9,.3,1); }
  .pop:not(.sheet):not(.dialog):not(.full) .removebox { animation: dropin .18s cubic-bezier(.2,.9,.3,1.1); transform-origin: top left; }
  .scrim:not([hidden]) { animation: fade .25s ease-out; }
  @keyframes sheetup { from { transform: translateY(100%); } to { transform: none; } }
  @keyframes popin { from { opacity: 0; transform: translate(-50%, -48%) scale(.96); } to { opacity: 1; transform: translate(-50%, -50%); } }
  @keyframes fullin { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
  @keyframes dropin { from { opacity: 0; transform: scale(.95) translateY(-4px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  /* A display rule (the full-screen edit page's flex) must never beat hidden: that left a black screen after Cancel */
  [hidden] { display: none !important; }
  .scrim { position: fixed; inset: 0; z-index: 49; background: rgba(0,0,0,.35); }
  .pop.sheet { left: 0; right: 0; top: auto; bottom: 0; width: auto; transition: top .18s ease-out; }
  .pop.sheet .removebox { border-radius: 18px 18px 0 0; padding: 8px 12px calc(12px + env(safe-area-inset-bottom)); border-bottom: 0; }
  .sheet-title { position: relative; z-index: 1; margin: 0 12px -4px; padding: 12px 4px 8px; font-weight: 600; font-size: 14px;
    color: var(--muted); background: var(--surface); border-radius: 18px 18px 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pop.sheet .sheet-title { margin: 0; padding: 14px 16px 6px; border: 1px solid var(--line); border-bottom: 0; }
  .pop.sheet .sheet-title + .removebox { border-radius: 0; border-top: 0; }
  body.kbd nav { display: none; }
  .pop.dialog { left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(440px, calc(100vw - 32px)); }
  .scrim { touch-action: none; }
  .pop.full { inset: 0; background: var(--ground); display: flex; flex-direction: column; }
  .pop.full .fullbar { flex: none; display: flex; align-items: center; justify-content: space-between;
    padding: calc(6px + env(safe-area-inset-top)) 8px 6px; border-bottom: 1px solid var(--line); background: var(--surface); }
  .pop.full .fullbar b { font-size: 16px; }
  .pop.full .fullbar button { background: none; color: var(--accent); font-size: 16px; height: 44px; padding: 0 10px; }
  .pop.full .fullbar .strong { font-weight: 700; }
  .pop.full .editform { flex: 1; max-height: none; border: 0; border-radius: 0; box-shadow: none; background: var(--ground);
    padding: 8px 16px calc(24px + env(safe-area-inset-bottom)) !important; }
  .pop.full .editform .whyhead { margin-top: 6px; }
  .pop.full .editform textarea, .pop.full .editform input { background: var(--surface); }
  .pop.sheet .removebox { overflow-y: auto; overscroll-behavior: contain; }
  .editform { max-height: 85vh; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding: 14px 14px calc(14px + env(safe-area-inset-bottom)) !important; }
  .editform label { display: block; font-size: 11.5px; font-weight: 600; color: var(--muted); text-transform: uppercase;
    letter-spacing: .04em; margin: 10px 0 4px; }
  .editform textarea, .editform input { background: var(--ground); }
  /* iOS gives date inputs an intrinsic width that pushed Scheduled past the edge (Oct 31) */
  .editform .frow > div { min-width: 0; }
  .editform input[type="date"] { -webkit-appearance: none; appearance: none; width: 100%; min-width: 0; box-sizing: border-box; display: block; }
  .editform .fstatus button { font-size: 13px; padding: 0 4px; }
  .editform .frow { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .editform .seg { margin: 0; }
  .sendform .sfrom button { font-size: 12.5px; padding: 0 4px; }
  .sendform .s-body { min-height: 180px; }
  .sendform .linkbtn { background: none; color: var(--accent); padding: 0; height: auto; font-size: inherit; font-weight: 600; }
  .sendform .s-warn { color: var(--ink); font-weight: 600; }
  .sendform .s-hist, .sendform .s-rel { margin-top: 8px; font-size: 13.5px; }
  .sendform .s-rel { margin-top: 16px; }
  .sendform .s-hist .lbl, .sendform .s-rel .lbl { font-size: 11.5px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 8px 0 4px; }
  .sendform .hmsg { background: var(--soft); border-radius: 10px; padding: 7px 10px; margin-bottom: 5px; color: var(--ink2); }
  .sendform .hrel { display: block; padding: 6px 0; border-bottom: 1px solid var(--line); color: var(--ink); text-decoration: none; }
  .sendform .hrel small { display: block; color: var(--muted); }
  .sendform .s-held { margin-top: 10px; background: var(--soft); border-radius: 12px; padding: 8px 10px; font-size: 13.5px; }
  .editform .acts button { flex: 1; }
  .journal .jcheck { display: flex; gap: 10px; align-items: center; text-transform: none; letter-spacing: 0; font-size: 15px;
    font-weight: 500; color: var(--ink); margin: 6px 0; }
  .journal .jcheck input { width: 22px; height: 22px; }
  .whystep { padding: 14px 14px calc(12px + env(safe-area-inset-bottom)) !important; }
  .whyhead { font-weight: 600; font-size: 15px; margin-bottom: 8px; }
  .whystep .acts button { flex: 1; }
  .pop .removebox { display: block; margin: 0; }
  .removebox { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 8px;
    box-shadow: 0 12px 32px rgba(23,23,28,.18); }
  .removebox .in-why { margin-top: 6px; }
  .pop .removebox { padding: 4px; }
  .reasons { display: flex; flex-direction: column; }
  .reasons button { text-align: left; min-height: 48px; padding: 8px 10px; border-radius: 10px; background: none;
    color: var(--ink); font-weight: 600; font-size: 15px; display: flex; flex-direction: column; justify-content: center; }
  .reasons button + button { border-top: 1px solid var(--line); border-radius: 0; }
  .reasons button:active { background: var(--soft); }
  .reasons small { font-size: 12.5px; color: var(--muted); font-weight: 400; margin-top: 1px; }
  .empty { text-align: center; color: var(--muted); padding: 40px 16px; }
  .zen { text-align: center; padding: 28px 16px 36px; }
  .zen-svg { width: 168px; height: 168px; display: block; margin: 0 auto 6px; overflow: visible; }
  .zen-enso { fill: none; stroke: var(--ink); stroke-width: 7; stroke-linecap: round; opacity: .88; }
  .zen-enso.thin { stroke-width: 2.2; opacity: .35; }
  .zen-ring { fill: none; stroke: var(--accent); stroke-width: 1.2; opacity: 0; transform-origin: 80px 80px; }
  .zen-dot { fill: var(--accent); opacity: .7; }
  .zen-h { font-size: 22px; font-weight: 650; letter-spacing: -.01em; color: var(--ink); }
  .zen-s { color: var(--muted); margin-top: 6px; font-size: 15px; line-height: 1.45; max-width: 340px; margin-left: auto; margin-right: auto; }
  .zen.play .zen-enso { stroke-dasharray: 100; stroke-dashoffset: 100; animation: zen-draw 1.9s cubic-bezier(.55,.05,.35,1) .25s forwards; }
  .zen.play .zen-enso.thin { animation-delay: .45s; }
  .zen.play .zen-ring { animation: zen-ripple 3.2s ease-out 2s forwards; }
  .zen.play .zen-ring.r2 { animation-delay: 2.7s; }
  .zen.play .zen-dot { opacity: 0; animation: zen-in .8s ease 1.9s forwards; }
  .zen.play .zen-svg { animation: zen-breathe 4s ease-in-out 2.2s 2; }
  .zen.play .zen-h, .zen.play .zen-s { opacity: 0; transform: translateY(6px); animation: zen-rise .9s ease 2.1s forwards; }
  .zen.play .zen-s { animation-delay: 2.5s; }
  @keyframes zen-draw { to { stroke-dashoffset: 0; } }

<script>

const liveStored = store("checkin-live");
let testMode = liveStored === "1" ? false : liveStored === "0" ? true
  : !(!inTg && window.matchMedia && matchMedia("(pointer: fine) and (min-width: 900px)").matches);

if (tab === "plan") tab = "today";   // Plan took over ToDo's selection (Nov 1)

let openSummary = false;

  if (!view || !view.do) return () => {};

  return () => { view.do = JSON.parse(snap); lastJson = null; render(); };
}

  const r = d.rows.find(x => x.id === id);

}

}
// What a task waits on, edited in the fold: saved when he leaves the field or presses Return.
document.addEventListener("keydown", (e) => {
  if (!e.target.classList || !e.target.classList.contains("in-wait")) return;

document.addEventListener("focusout", (e) => {

});
document.addEventListener("keydown", (e) => {

async function api(path, body) {
  const r = await fetch(base + path, {
    method: body ? "POST" : "GET",
    headers: {"x-init-data": initData, "content-type": "application/json"},
    body: body ? JSON.stringify({day, ...body, test: testMode, tab: (body && body.tab) || tab}) : undefined,
  });
  const j = await r.json().catch(() => ({}));
  if (r.status === 403 && !inTg) { location.href = base + "login"; throw new Error("sign in"); }
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}

async function saveEdit(send) {

function planBlocks(text) {

  const re = fence ? /^\s*(\d{1,2})[:.](\d{2})\s*[-–—]\s*(\d{1,2})[:.](\d{2})\s*(.*)/

    let note = full;

const IMG_KEEP = 3 * 1024 * 1024, IMG_SIDE = 2000;

// PDFs (Nov 3, the owner: "Yes, add PDFs") ride with the screenshots: same route, same 4 per
// message; the vault file keeps its own name after the date, which the thread shows.
const PDF_MAX = 12 * 1024 * 1024;
const isPdfFile = f => f.type === "application/pdf" || (!f.type && /\.pdf$/i.test(f.name || ""));
function pdfLabel(u) {
  const m = /[?&]p=([^&]+)/.exec(u || "");
  const rel = m ? decodeURIComponent(m[1]) : "";
  return /\.pdf$/i.test(rel) ? rel.split("/").pop().replace(/^\d{4}-\d\d-\d\d \d{6} /, "") : "";
}

async function shrinkImage(file) {
  if (file.size <= IMG_KEEP && /^image\/(png|jpeg|webp|gif)$/.test(file.type)) return file;
  const url = URL.createObjectURL(file);
  try {
    // Chrome cannot decode HEIC (iPhone photos AirDropped to the Mac, Nov 3), so say what to do
    const im = await new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i);
      i.onerror = () => bad(new Error(/hei[cf]/i.test(file.type + file.name)
        ? "HEIC cannot be read here, export it as JPEG first" : "could not read " + (file.name || "the image")));
      i.src = url; });
    const k = Math.min(1, IMG_SIDE / Math.max(im.naturalWidth, im.naturalHeight));
    const cv = document.createElement("canvas");
    cv.width = Math.round(im.naturalWidth * k); cv.height = Math.round(im.naturalHeight * k);
    cv.getContext("2d").drawImage(im, 0, 0, cv.width, cv.height);
    return await new Promise(ok => cv.toBlob(ok, "image/jpeg", 0.85));
  } finally { URL.revokeObjectURL(url); }
}
async function addImages(files) {
  const c = chat;
  if (!c) return;
  c.images = c.images || [];
  // A PDF or other file was dropped without a word (Nov 3, "uploading files from mac does not
  // work"): name what was left out instead.
  const ok = f => /^image\//.test(f.type) || isPdfFile(f);
  const all = Array.from(files || []), skip = all.filter(f => !ok(f));
  if (skip.length) toast(`Could not attach ${skip.map(f => f.name || "that file").join(", ")}: only images and PDFs`);
  for (const f of all.filter(ok)) {
    if (c.images.length >= 4) { toast("Could not attach more: up to 4 files per message"); break; }
    const pdf = isPdfFile(f);
    if (pdf && f.size > PDF_MAX) { toast(`Could not attach ${f.name}: over 12 MB`); continue; }
    const item = pdf ? {pdf: (f.name || "Document").replace(/\.pdf$/i, "")} : {local: URL.createObjectURL(f)};
    c.images.push(item); if (chat === c) paintThumbs();
    try {
      const blob = pdf ? f : await shrinkImage(f);
      const res = await fetch(base + "api/chat/image" + (pdf ? "?name=" + encodeURIComponent(f.name || "") : ""), {method: "POST", body: blob,
        headers: {"x-init-data": initData, "content-type": pdf ? "application/pdf" : (blob.type || "image/jpeg")}});
      const j = await res.json().catch(() => ({}));
      if (res.status === 403 && !inTg) { location.href = base + "login"; return; }
      if (!res.ok) throw new Error(j.error || res.status);
      item.path = j.path; item.url = j.url;
    } catch (e) {
      toast((pdf ? "PDF" : "Screenshot") + " failed: " + e.message);

}

// Voice messages (Oct 31): MediaRecorder in the page (m4a on the iPhone, webm in Chrome), sent
// whole when he taps Send; vault-host transcribes it with the bridge's Transcriber, keeps no
// audio, and the transcript continues the chat as his message.
let rec = null;
const REC_MAX_S = 300;
async function startRec() {
  if (!chat || rec) return;
  if (!navigator.mediaDevices || !window.MediaRecorder) { toast("Voice could not start here; the keyboard's dictation works"); return; }
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({audio: true}); }
  catch (e) { toast("Could not use the microphone: " + (e.message || e.name)); return; }
  if (!chat) { stream.getTracks().forEach(t => t.stop()); return; }
  const type = ["audio/mp4", "audio/webm;codecs=opus", "audio/webm", "audio/ogg;codecs=opus"]
    .find(t => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || "";
  const mr = new MediaRecorder(stream, type ? {mimeType: type} : undefined);
  rec = {mr, stream, chunks: [], t0: Date.now(), send: false, chat};
  mr.ondataavailable = e => { if (e.data && e.data.size && rec) rec.chunks.push(e.data); };
  mr.onstop = finishRec;
  mr.start(1000);
  document.getElementById("ccomp").classList.add("recording");
  const send = document.getElementById("csend");
  send.textContent = "Send"; send.dataset.chat = "recsend"; send.classList.remove("stop");
  const tick = () => {
    const s = Math.floor((Date.now() - rec.t0) / 1000), el = document.getElementById("crec-t");
    if (el) el.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
    if (s >= REC_MAX_S) stopRec(true);
  };
  rec.timer = setInterval(tick, 250); tick(); haptic();
}
function stopRec(send) {
  if (!rec || rec.mr.state === "inactive") return;
  rec.send = send; clearInterval(rec.timer); rec.mr.stop();
}
async function finishRec() {
  const r = rec; rec = null;
  if (!r) return;
  r.stream.getTracks().forEach(t => t.stop());
  const comp = document.getElementById("ccomp");
  if (comp) comp.classList.remove("recording");
  const send = document.getElementById("csend");
  if (send) { send.textContent = "Send"; send.dataset.chat = "send"; }
  if (!r.send || chat !== r.chat) return;
  if (Date.now() - r.t0 < 800) { toast("Too short, nothing sent"); return; }
  const c = chat, blob = new Blob(r.chunks, {type: (r.mr.mimeType || "audio/mp4").split(";")[0]});
  const log = document.getElementById("clog");
  log.insertAdjacentHTML("beforeend", `<div class="msg claude thinking in"><span class="dots"><i></i><i></i><i></i></span><span>Transcribing…</span></div>`);
  document.getElementById("cmsgs").scrollTop = 1e9;

  try {
    const res = await fetch(base + "api/chat/voice?" + qs, {method: "POST", body: blob,
      headers: {"x-init-data": initData, "content-type": blob.type || "audio/mp4"}});
    const j = await res.json().catch(() => ({}));
    if (res.status === 403 && !inTg) { location.href = base + "login"; return; }
    if (!res.ok) throw new Error(j.error || res.status);
    c.first = false;

  }

// A phone number in a WhatsApp draft's `to` (+ and the full number, or a WhatsApp chat id: those digits, then the s.whatsapp.net suffix) opens the chat.
function waNumber(to) {
  const s = String(to || "").trim(), m = /^(\d{8,15})@s\.whatsapp\.net$/.exec(s);
  if (m) return m[1];
  return /^\+?[\d\s().-]{8,}$/.test(s) ? s.replace(/\D/g, "") : "";
}
// The clipboard API, with a selected textarea and execCommand where it is refused (iOS home-screen app, Telegram).
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) {}
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly", ""); ta.style.cssText = "position:fixed;top:0;left:0;opacity:0;font-size:16px";
  document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0, text.length);
  let ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
  ta.remove(); return ok;
}

function snapshot() {
  const m = {};
  document.querySelectorAll("#app [data-id]").forEach(el => { if (!(el.dataset.id in m)) m[el.dataset.id] = el.getBoundingClientRect().top; });
  return m;
}
function flip(before, animate) {
  if (!animate || !Element.prototype.animate) return;
  const seen = new Set(), had = Object.keys(before).length;
  document.querySelectorAll("#app [data-id]").forEach(el => {
    const id = el.dataset.id; if (seen.has(id)) return; seen.add(id);
    const top = el.getBoundingClientRect().top;
    if (id in before) {
      const dy = before[id] - top;
      if (Math.abs(dy) > 1) el.animate([{transform: `translateY(${dy}px)`}, {transform: "none"}],
                                       {duration: 480, easing: "cubic-bezier(.22,.8,.25,1)"});
    } else if (had) {
      el.animate([{opacity: 0, transform: "translateY(8px) scale(.98)"}, {opacity: 1, transform: "none"}],
                 {duration: 360, easing: "cubic-bezier(.22,.8,.3,1)"});
    }
  });
}

    // Oct 31, the owner: the tasks open until there is a plan, then folded (unfold to edit and

async function load(first) {
  try {
    const next = await api("api/view" + (first ? "?open=1" : ""));
    const same = !first && lastJson === JSON.stringify(next);
    view = next; lastJson = JSON.stringify(next);
    syncSel();
    if (!same) render();
    if (first && view.prerun && view.prerun.running && !polling) watchPrerun(stamp(view));
  } catch (e) {
    if (!view) document.getElementById("app").innerHTML = `<div class="empty">Could not load: ${esc(e.message)}</div>`;
  }
}

// While an update runs: reload every 10 s, stop when it ends, say whether it worked.
const stamp = v => (v && v.generated || "") + "|" + (v && v.updated || "");
function watchPrerun(before) {
  clearInterval(polling);
  load().then(() => render());
  polling = setInterval(async () => {
    await load();
    if (view && view.prerun && !view.prerun.running) {
      clearInterval(polling); polling = null;
      toast(view.prerun.last_ok && stamp(view) !== before ? "Updated"
                                                           : "Update failed, the data is unchanged");
    }
  }, 10000);
}

// Refresh reruns the pre-run: new mail, WhatsApp, calendar and the latest meditation.
async function refresh() {
  if (view && view.prerun && view.prerun.running) return;
  try {
    const res = await api("api/act", {action: "meditation"});
    haptic(); toast(res.msg);
    if (res.running) { view.prerun = {running: true}; render(); watchPrerun(stamp(view)); }

}

// Pull down hard at the top to refresh, as on any iPhone list (owner decision, Oct 31).
const ptr = document.createElement("div");
ptr.id = "ptr"; ptr.innerHTML = "<span>Pull to refresh</span>"; document.body.appendChild(ptr);
const PULL = 90;
let pull = null;
document.addEventListener("touchstart", (e) => {
  pull = null;
  if (window.scrollY > 0 || busy() || document.body.style.position === "fixed" || !e.touches[0]) return;
  pull = {x: e.touches[0].clientX, y: e.touches[0].clientY, d: 0};
}, {passive: true});
document.addEventListener("touchmove", (e) => {
  if (!pull) return;
  const dx = e.touches[0].clientX - pull.x, dy = e.touches[0].clientY - pull.y;
  if (dy <= 0 || Math.abs(dx) > dy) { pull.d = 0; ptr.style.opacity = 0; return; }
  pull.d = dy * 0.5;
  const running = view && view.prerun && view.prerun.running;
  ptr.style.opacity = Math.min(1, pull.d / PULL);
  ptr.style.transform = `translateY(${Math.min(pull.d, PULL) - 20}px)`;
  ptr.classList.toggle("ready", pull.d >= PULL);
  ptr.firstChild.textContent = running ? "Already updating…" : pull.d >= PULL ? "Release to refresh" : "Pull to refresh";
}, {passive: true});
document.addEventListener("touchend", () => {
  if (!pull) return;
  const go = pull.d >= PULL; pull = null;
  ptr.style.transition = "opacity .25s, transform .25s"; ptr.style.opacity = 0; ptr.style.transform = "";
  setTimeout(() => { ptr.style.transition = ""; }, 260);
  if (go) refresh();
});

function busy() {
  const a = document.activeElement;
  return (a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA")) || popCard || document.querySelector(".editing");
}
// Swipe on the phone (owner decision, Oct 30): right = Add (or take out again), left = Remove.
// Only a clearly horizontal drag counts, so scrolling never triggers anything.
let sw = null;
document.addEventListener("touchstart", (e) => {
  const row = e.target.closest(".item");
  if (!row || e.target.closest("button, input, textarea") || !row.querySelector('[data-a="select"], [data-a="unselect"]')) return;
  const t = e.touches[0];
  sw = {row, x: t.clientX, y: t.clientY, dx: 0, on: false};
}, {passive: true});
document.addEventListener("touchmove", (e) => {
  if (!sw) return;
  const t = e.touches[0], dx = t.clientX - sw.x, dy = t.clientY - sw.y;
  if (!sw.on) {
    if (Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy) * 1.5) sw.on = true;
    else { if (Math.abs(dy) > 12) sw = null; return; }
  }
  e.preventDefault();
  sw.row.style.transition = "none";   // the row follows the finger 1:1, no easing lag
  sw.dx = dx;
  sw.row.style.transform = `translateX(${dx}px)`;
  sw.row.classList.toggle("sw-add", dx > 0);
  sw.row.classList.toggle("sw-rem", dx < 0);
  sw.row.classList.toggle("sw-go", Math.abs(dx) > 80);
}, {passive: false});
document.addEventListener("touchend", () => {
  if (!sw) return;
  const {row, dx, on} = sw; sw = null;
  row.style.transition = "transform .2s"; row.style.transform = "";
  setTimeout(() => {
    row.style.transition = ""; row.classList.remove("sw-add", "sw-rem", "sw-go");
    if (!on) return;
    const b = dx > 80 ? row.querySelector('[data-a="select"], [data-a="unselect"]')
            : dx < -80 ? row.querySelector('[data-a="removeopen"]') : null;
    if (b) b.click();
  }, 200);
});

// The DoD, the proposed rewrites and the steps, on the Do card and in the Start panel (Nov 1).
async function taskOp(el) {
  const holder = el.closest("[data-id]"), id = holder && holder.dataset.id, op = el.dataset.tp, r = id && doRow(id);
  if (!r) return;
  const d = r.detail || {}, box = el.closest(".tp-dodsec, .ddod, .tp-stepsec");
  if (op === "dodedit" && box) {
    box.innerHTML = `<label>Definition of Done</label><textarea class="in-tp" rows="3" placeholder="What done well looks like: the whole scope, with whom, what well means">${esc(d.dod || "")}</textarea>
      <div class="tp-acts"><button class="link" data-tp="dodsave">Save</button> · <button class="link" data-tp="cancel">Cancel</button></div>`;
    box.querySelector("textarea").focus(); return;
  }
  if (op === "stepsedit" && box) {
    const lines = [clean(r.next)].concat((d.steps || []).map(clean)).filter(Boolean);
    box.innerHTML = `<label>Steps, one per line, the next one first</label><textarea class="in-tp" rows="${Math.max(4, lines.length + 1)}">${esc(lines.join("\n"))}</textarea>
      <div class="tp-acts"><button class="link" data-tp="stepssave">Save</button> · <button class="link" data-tp="cancel">Cancel</button></div>`;
    box.querySelector("textarea").focus(); return;
  }
  if (op === "cancel") { refreshTask(); return; }
  if (op === "sub") {
    // A part of the Next step: ticked here only; the last one ticks the step itself (step_done).
    const n = +el.dataset.n, parts = stepParts(r.next).length, done = subDone(r), on = !done.has(n);
    on ? done.add(n) : done.delete(n);
    view.subticks = view.subticks || {};
    const sid = (r.detail || {}).next_id || "";
    view.subticks[r.id] = {sid, next: r.next, done: [...done]};
    refreshTask(); haptic();
    try {
      await api("api/act", {id, action: "subtick", next: r.next, sid, n, on});
      if (on && done.size >= parts) {
        const res = await api("api/act", {id, action: "step_done", tab: "panel"});
        lastStep = {id, title: r.title, state: res.state, who: res.who || "", next: res.next || "", until: Date.now() + STEP_SHOW_MS};
        await load(); refreshTask();
      }
    } catch (e) { toast("Failed: " + e.message); }
    return;
  }
  if (op === "discard") {
    // The × on a step (Nov 4): struck in the note, never deleted; a discarded Next brings up the next one.
    const s = el.dataset.next ? r.next : (d.steps || [])[+el.dataset.n];
    const sid = (el.dataset.next ? d.next_id : (d.step_ids || [])[+el.dataset.n]) || "";
    if (!s) return;
    el.disabled = true; const li = el.closest("li"); if (li) li.style.opacity = ".3";
    try { const res = await api("api/act", {id, action: "step_discard", text: s, sid}); if (testMode) toast(res.msg); haptic(); await load(); refreshTask(); }
    catch (e) { el.disabled = false; if (li) li.style.opacity = ""; toast("Failed: " + e.message); }
    return;
  }
  if (op === "line") {
    const s = (d.steps || [])[+el.dataset.n], sid = (d.step_ids || [])[+el.dataset.n] || "";
    if (!s) return;
    el.disabled = true;
    try { await api("api/act", {id, action: "tick_line", text: s, sid}); haptic(); await load(); refreshTask(); }
    catch (e) { el.disabled = false; toast("Failed: " + e.message); }
    return;
  }
  const body = {id, action: {dodok: "dod_confirm", dodsave: "dod_set", propok: "prop_accept", propno: "prop_ignore", stepssave: "steps_save"}[op]};
  if (!body.action) return;
  const ta = box && box.querySelector("textarea");
  if (op === "dodsave") { body.text = ta ? ta.value : ""; if (!body.text.trim()) return; }
  if (op === "stepssave") body.steps = (ta ? ta.value : "").split("\n").map(x => x.trim()).filter(Boolean);
  if (op === "propok" || op === "propno") { const x = (r.prop || [])[+el.dataset.i]; if (!x) return; body.old = x.old; body.new = x.new; }
  el.disabled = true;
  try { const res = await api("api/act", body); haptic(); if (res.msg) toast(res.msg); await load(); refreshTask(); }
  catch (e) { el.disabled = false; toast("Failed: " + e.message); }
}

document.addEventListener("click", async (ev) => {
  const t = ev.target;

  // every link goes through openLink with an absolute URL (file?… links are relative to the app).
  const a = t.closest("a[target=_blank]");
  if (a && a.getAttribute("href")) {
    ev.preventDefault();
    const url = new URL(a.getAttribute("href"), location.href).href;

    return;
  }
  const tp = t.closest("[data-tp]");   // before the sheet's own handling: the panel lives in it
  if (tp) { await taskOp(tp); return; }

    const doRemove = async (reason, why) => {
      const card = popCard;
      closePop();

        const notOne = reason === "notone";

                                                : {id: card.dataset.id, action: "remove", reason, why});

    const sendBtn = t.closest("#pop [data-send]");

    if (fromBtn) { sendUserFrom = true; const fw = document.querySelector("#pop .s-fromwhy"); if (fw) fw.hidden = true; fromBtn.parentElement.querySelectorAll("button").forEach(b => b.classList.toggle("on", b === fromBtn)); sendCheck(); return; }

  const db = t.closest("[data-day]");
  if (db) { day = db.dataset.day; fold = null; render(); return; }
  const pb = t.closest("[data-plan]");
  if (pb) { planDay = pb.dataset.plan; render(); return; }
  if (t.closest("#meditate")) { openJournal(); return; }
  if (t.closest("#refresh")) { refresh(); return; }
  if (t.closest("#to-plan")) {
    // Confirming Claude's pre-selection is itself a signal (adopted Oct 30).
    api("api/act", {action: "confirm", ids: selection(day).map(r => r.id)}).catch(() => {});
    planDay = day; tab = "plan"; store("checkin-tab", tab); render(); window.scrollTo(0, 0); return;
  }
  if (t.closest("#plan-go")) {
    // Create plan sends the list as the chat's first message; Update plan sends what changed
    // into the same chat (Oct 31). The tasks fold, the day and the chat show below.
    const pd = planDay || day, ids = selection(pd).map(r => r.id), pu = planUi[pd] || (planUi[pd] = {});
    const was = planHas(pd), text = was ? planUpdateText(pd, ids) : "";
    pu.folded = true; pu.started = true;
    // What he plans is what he does that day (Nov 1): the list goes to Do in this order.
    const chunks = {};
    const chunk_ids = {};
    selection(pd).forEach(r => { const s = taskSteps(r), n = chunkN(r, pd); if (n) { chunks[r.id] = s.slice(0, n); const ci = taskStepIds(r).slice(0, n).filter(Boolean); if (ci.length) chunk_ids[r.id] = ci; } });
    // The commit lands before the plan goes to Claude (Nov 6): Claude counts the committed chunks,
    // and a plan Do never received is not sent at all.
    render();
    try { await api("api/act", {action: "do_commit", ids, day: pd, chunks, chunk_ids}); }
    catch (e) { pu.folded = false; pu.started = was; render(); toast("Failed to update Do, the plan was not sent: " + e.message); return; }
    if (!was) api("api/act", {action: "confirm", ids, day: pd}).catch(e => toast("Failed to log the confirm: " + e.message));
    if (!chat || !chat.inline) return;
    if (!was) { chat.ids = ids; chat.first = true; }
    sendChat(text); pu.sent = ids.slice();
    if (pu.dayEl) pu.dayEl.scrollIntoView({behavior: "smooth", block: "start"});
    return;
  }
  if (t.closest("[data-dofold]")) { openDoneFold = !openDoneFold; render(); return; }
  if (t.closest("[data-waitfold]")) { openWaitFold = !openWaitFold; render(); return; }
  if (t.closest("[data-leftfold]")) { openLeftFold = !openLeftFold; render(); return; }
  if (t.closest("[data-winsfold]")) { openWinsFold = !openWinsFold; render(); return; }
  const stepBtn = t.closest("[data-step]");
  if (stepBtn) {
    const holder = stepBtn.closest("[data-id]"), id = holder && holder.dataset.id, op = stepBtn.dataset.step;
    if (!id) return;
    if (op === "wedit") {
      editWait = id; editDraft = null; render();
      const el = document.querySelector(`.dwait[data-id="${CSS.escape(id)}"] .in-wait`);
      if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
      return;
    }
    if (op === "nudge") {
      const w = ((view.do && view.do.waiting) || []).find(x => x.id === id) || {};
      openChat({kind: "task", id, title: w.title || id, tab: "do", from: "nudge",
                send: `No answer yet on: ${w.who || "the wait"}. Draft a short, friendly follow-up for me to send.`});
      return;
    }
    if (op === "waittoggle") {
      // Waiting is one button (owner decision, Nov 3): pressed, the reason field opens in the card and
      // nothing moves; Save sends it to the Waiting fold; pressed again before Save, it cancels.
      pendingWait = pendingWait && pendingWait.id === id ? null : {id, text: stepBtn.dataset.guess || ""};
      render();
      const el = document.querySelector(`.doitem[data-id="${CSS.escape(id)}"] .in-wait-new`);
      if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
      return;
    }
    if (op === "waitsave") {
      const el = holder.querySelector(".in-wait-new"), text = el ? el.value.trim() : "";
      if (!text) { if (el) el.focus(); return; }
      pendingWait = null;
      const wr = findRow(id), more = wr && wr.detail && (wr.detail.steps || []).length;
      if (!more) openWaitFold = true;
      const undo = doLocal(d => { if (!more) doWaitRow(d, id, text); });
      haptic(); doTap({id, action: "set_waiting", text}, undo);
      return;
    }
    if (op === "notwait") {
      const undo = doLocal(d => { d.waiting = (d.waiting || []).filter(x => x.id !== id); });
      haptic(); lastStep = null; doTap({id, action: "not_waiting"}, undo);
      return;
    }
    stepBtn.disabled = true;
    try {
      await api("api/act", {id, action: op === "undo" ? "step_undo" : "not_waiting"});
      haptic(); lastStep = null; load();
    } catch (e) { stepBtn.disabled = false; toast("Failed: " + e.message); }
    return;
  }
  const fb = t.closest("[data-fold]");
  if (fb) { fold = fold === fb.dataset.fold ? null : fb.dataset.fold; render(); return; }
  if (t.id === "go-live") {
    ev.preventDefault();
    const go = () => { testMode = false; store("checkin-live", "1"); render(); };
    if (inTg) tg.showConfirm("Go live? Taps will change your real tasks.", ok => ok && go());
    else if (confirm("Go live? Taps will change your real tasks.")) go();
    return;
  }
  if (t.id === "go-test") { ev.preventDefault(); testMode = true; store("checkin-live", "0"); render(); return; }
  if (t.id === "go-live" || t.id === "go-test") sel._init = false;
  if (t.id === "add-open") { document.getElementById("addbar").classList.toggle("on"); document.getElementById("new-task").focus(); return; }
  if (t.id === "add-btn") {
    const inp = document.getElementById("new-task");
    if (!inp.value.trim()) return;
    try {
      const res = await api("api/act", {action: "add", text: inp.value}); haptic(); inp.value = ""; toast(res.msg);
      if (!testMode) load();
    }
    catch (e) { toast("Failed: " + e.message); }
    return;
  }
  const ansBtn = t.closest("button[data-answer]");
  if (ansBtn) {
    const card = ansBtn.closest("[data-id]"), box = ansBtn.closest(".ask");
    const answer = ansBtn.dataset.answer || box.querySelector(".in-answer").value.trim();
    if (!answer) return;
    ansBtn.disabled = true;
    try { const res = await api("api/act", {id: card.dataset.id, action: "answer", q: box.dataset.q, text: answer}); haptic(); toast(res.msg); load(); }
    catch (e) { ansBtn.disabled = false; toast("Failed: " + e.message); }
    return;
  }
  const olb = t.closest("button[data-old]");
  if (olb && olb.closest("[data-id]")) {
    const card = olb.closest("[data-id]"), how = olb.dataset.old, id = card.dataset.id;
    olb.disabled = true;
    try {
      const res = await api("api/act", how === "keep" ? {id, action: "cleanup_keep", tab} : {id, action: "cleanup_close", how, tab});
      if (res.msg) toast(res.msg);
      view.cleanup = (view.cleanup || []).map(c => c.task !== id ? c : (res.state === "cleanup" ? Object.assign({}, c, {old: false}) : null)).filter(Boolean);
      render();
    } catch (e) { olb.disabled = false; toast("Failed: " + e.message); }
    return;
  }
  const clb = t.closest("button[data-clean]");
  if (clb && clb.closest("[data-id]")) {
    const card = clb.closest("[data-id]");
    clb.disabled = true;
    try { const res = await api("api/act", {id: card.dataset.id, action: clb.dataset.clean === "apply" ? "cleanup_apply" : "cleanup_skip", tab}); if (res.msg) toast(res.msg); view.cleanup = (view.cleanup || []).filter(c => c.task !== card.dataset.id); render(); }
    catch (e) { clb.disabled = false; toast("Failed: " + e.message); }
    return;
  }
  const acb = t.closest("button[data-actual]");
  if (acb && acb.closest("[data-sid]")) {
    const box = acb.closest("[data-sid]");
    try { await api("api/act", {id: box.dataset.id, action: "actual_check", sid: box.dataset.sid, answer: acb.dataset.actual, tab}); box.remove(); }
    catch (e) { toast("Failed: " + e.message); }
    return;
  }
  const ocb = t.closest("button[data-outcome]");
  if (ocb && ocb.closest("[data-id]")) {
    const card = ocb.closest("[data-id]"), txt = window.prompt("Today's outcome", ocb.dataset.outcome);
    if (txt === null) return;
    try { await api("api/act", {id: card.dataset.id, action: "do_outcome", text: txt, tab}); load(); }
    catch (e) { toast("Failed: " + e.message); }
    return;
  }
  const bxb = t.closest("button[data-box]");
  if (bxb && bxb.closest("[data-id]")) {
    const card = bxb.closest("[data-id]");
    bxb.disabled = true;
    try { const res = await api("api/act", {id: card.dataset.id, action: "step_box", sid: bxb.dataset.box, tab}); if (res.msg) toast(res.msg); load(); }
    catch (e) { bxb.disabled = false; toast("Failed: " + e.message); }
    return;
  }
  const shb = t.closest("button[data-sharpen]");
  if (shb && shb.closest("[data-id]")) {
    const card = shb.closest("[data-id]");
    // The step contract (Tasks v2, Nov 6): an unclear step goes to the task chat to be sharpened.
    fbOpen = card.dataset.id + "|" + card.dataset.sid; render();
    return;
  }
  const vtb = t.closest("button[data-vote]");
  if (vtb && vtb.closest("[data-sid]")) {
    const box = vtb.closest("[data-sid]"), k = box.dataset.id + "|" + box.dataset.sid, d = fbDraft[k], code = vtb.dataset.code, v = vtb.dataset.vote;
    if (code === "_est") d.est.vote = d.est.vote === v ? "" : v; else d.votes[code] = d.votes[code] === v ? "" : v;
    render();
    return;
  }
  const fbb = t.closest("button[data-fb]");
  if (fbb && fbb.closest("[data-sid]")) {
    const box = fbb.closest("[data-sid]"), id = box.dataset.id, sid = box.dataset.sid, k = id + "|" + sid, d = fbDraft[k] || {votes: {}, est: {}, note: ""};
    const c = (view.review || []).find(x => x.task === id && x.sid === sid) || {}, how = fbb.dataset.fb;
    if (how === "close") { fbOpen = ""; render(); return; }   // the draft stays for next time
    const votes = Object.fromEntries(Object.entries(d.votes).filter(([, v]) => v));
    if (how === "fine") (c.explain || []).forEach(e => { votes[e.code] = "wrong"; });
    const est = {vote: d.est.vote || "", min: d.est.min ? Number(d.est.min) : null};
    if (how !== "fine" && how !== "notatask" && !Object.keys(votes).length && !est.vote && !est.min && !(d.note || "").trim()) {
      const err = box.querySelector(".fberr"); if (err) err.hidden = false;
      return;
    }
    fbb.disabled = true;
    try {
      await api("api/act", {id, action: "step_feedback", sid, votes, est, note: d.note || "", verdict: how, tab});
      view.review = (view.review || []).filter(x => !(x.task === id && x.sid === sid)); delete fbDraft[k]; fbOpen = ""; render();
      toast(how === "fine" ? "Marked fine" : how === "notatask" ? "Step removed" : "Feedback saved");
      if (how === "notatask") { await api("api/act", {id, action: "step_discard", sid, text: c.next || "", tab}); load(); }
      if (how === "rewrite") {
        const r = findRow(id), wrong = (c.explain || []).filter(e => votes[e.code] !== "wrong").map(e => e.title);
        openChat({kind: "task", id, title: r ? r.title : id, row: r, tab, from: "sharpen",
                  send: "Sharpen the Next step so it keeps the step contract" + (wrong.length ? " (" + wrong.join("; ") + ")" : "") + ": "
                        + stripDue(clean(c.next || "")) + (d.note ? "\nMy note: " + d.note : "") + (est.min ? "\nIt takes me about " + est.min + " min." : "")});
      }
    } catch (e) { fbb.disabled = false; toast("Failed: " + e.message); }
    return;
  }
  const fnb = t.closest("button[data-fine]");
  if (fnb && fnb.closest("[data-sid]")) {
    const box = fnb.closest("[data-sid]");
    fnb.disabled = true;
    try { await api("api/act", {id: box.dataset.id, action: "step_fine", sid: box.dataset.sid, tab}); toast("Marked fine");
          view.review = (view.review || []).filter(c => !(c.task === box.dataset.id && c.sid === box.dataset.sid)); render(); }
    catch (e) { fnb.disabled = false; toast("Failed: " + e.message); }
    return;
  }
  if (t.closest("button[data-reviewall]")) { reviewAll = true; render(); return; }
  const crb = t.closest("button[data-crate]");
  if (crb && crb.closest("[data-cid]")) { cOpen = crb.closest("[data-cid]").dataset.cid; render(); return; }
  const cvb = t.closest("button[data-cvote]");
  if (cvb && cvb.closest("[data-cid]")) {
    const d = cDraft[cvb.closest("[data-cid]").dataset.cid], code = cvb.dataset.ccode, v = cvb.dataset.cvote;
    d.votes[code] = d.votes[code] === v ? "" : v; render();
    return;
  }
  const cfb = t.closest("button[data-cfb]");
  if (cfb && cfb.closest("[data-cid]")) {
    const box = cfb.closest("[data-cid]"), task = box.dataset.cid, how = cfb.dataset.cfb;
    if (how === "close") { cOpen = ""; render(); return; }
    const c = (view.chunk_review || []).find(x => x.task === task) || {}, d = cDraft[task] || {votes: {}, outcome: "", min: "", note: ""};
    const votes = Object.fromEntries(Object.entries(d.votes).filter(([, v]) => v));
    if (how !== "fine" && how !== "notatask" && !Object.keys(votes).length && !d.outcome.trim() && !d.min && !d.note.trim()) {
      const err = box.querySelector(".fberr"); if (err) err.hidden = false;
      return;
    }
    cfb.disabled = true;
    try {
      await api("api/act", {id: task, action: "do_chunk_feedback", verdict: how, votes, outcome: d.outcome || "", min: d.min ? Number(d.min) : null,
                            note: d.note || "", shown: {outcome: c.outcome, his: c.his, min: c.min, steps: (c.steps || []).map(x => x.text)}, tab});
      view.chunk_review = (view.chunk_review || []).filter(x => x.task !== task); delete cDraft[task]; cOpen = ""; render();
      toast(how === "fine" ? "Marked fine" : how === "notatask" ? "Taken off today" : "Feedback saved");
      if (how === "notatask") { await api("api/act", {id: task, action: "do_drop", tab}); load(); }
    } catch (e) { cfb.disabled = false; toast("Failed: " + e.message); }
    return;
  }
  const btn = t.closest("button[data-a]");
  const card = t.closest("[data-id]");
  if (!card) return;
  if (!btn) {
    if (card.classList.contains("item") && !t.closest(".edit") && !t.closest(".fbpanel") && !t.closest(".removebox") && !t.closest(".dwho") && !t.closest(".in-wait")) setOpen(card, !card.classList.contains("open"));
    return;
  }
  let action = btn.dataset.a, text = "", extra = {};
  if (action === "edit") {
    openEdit(card);
    api("api/act", {id: card.dataset.id, action: "mark", signal: tab === "claude" ? "claude_adjust" : "edit_opened"}).catch(() => {});
    return;
  }
  if (action === "start") { openTaskPanel(card.dataset.id); return; }
  if (action === "stepdone") {
    // Done on Do is the step (Nov 3): the server says what follows, the card goes, the line stays.
    const r = findRow(card.dataset.id), id = card.dataset.id;
    btn.disabled = true; card.classList.add("pending"); haptic();
    try {
      const res = await api("api/act", {id, action: "step_done", tab, over: r && r.wait_back ? 1 : 0});
      if (testMode) { btn.disabled = false; card.classList.remove("pending"); toast(res.msg); return; }
      lastStep = {id, title: r ? r.title : id, state: res.state, who: res.who || "",
                  next: res.next || "", guess: res.guess || "", until: Date.now() + STEP_SHOW_MS};
      setTimeout(() => { if (lastStep && Date.now() >= lastStep.until) { lastStep = null; render(); } }, STEP_SHOW_MS + 100);
      doLocal(d => {
        const row = d.rows.find(x => x.id === id);
        if (res.state === "waiting") doWaitRow(d, id, res.who || "");
        else if (res.state === "done") { d.rows = d.rows.filter(x => x.id !== id); if (row) d.done = [row].concat(d.done || []); }
        else if (row) { row.next = res.next || ""; row.next_short = ""; }
      });
      setTimeout(load, 0);
    } catch (e) { btn.disabled = false; card.classList.remove("pending"); toast("Failed: " + e.message); }
    return;
  }
  if (action === "talk" || action === "letclaude") {
    // Chat in the app instead of Telegram (Oct 31). Let Claude sends its request at once, as before.
    const r = findRow(card.dataset.id);
    openChat({kind: "task", id: card.dataset.id, title: r ? r.title : (card.querySelector(".title") || {}).textContent, row: r,
              tab: action === "letclaude" ? "claude" : tab, from: action,
              send: action === "letclaude" ? "Please do these now, as far as you can, and update the task: " + (r && r.prep ? r.prep.join("; ") : "") : undefined});
    return;
  }
  if (action === "sendopen") { openSend(card); return; }
  if (action === "copy" || action === "wa") {
    // WhatsApp and the other chats stay copy-only: he sends them himself (Oct 31). The text is
    // the card's, edited or not; WhatsApp opens the chat with it filled in.
    const r = findRow(card.dataset.id), ta = card.querySelector(".in-draft");
    const text = ta ? ta.value : ((r && r.draft && r.draft.body) || "");
    if (action === "wa") {
      const url = "https://wa.me/" + waNumber(r.draft.to) + "?text=" + encodeURIComponent(text);
      if (inTg && tg.openLink) tg.openLink(url); else window.open(url, "_blank");
    } else if (await copyText(text)) {
      haptic(); const was = btn.textContent; btn.textContent = "Copied";
      setTimeout(() => { btn.textContent = was; }, 1500);
    } else { toast("Failed: could not copy"); return; }
    api("api/act", {id: card.dataset.id, action: "mark", signal: "reply_copied", text, wa: action === "wa"}).catch(() => {});
    return;
  }
  if (action === "details") { setOpen(card, !card.classList.contains("open")); btn.setAttribute("aria-expanded", card.classList.contains("open")); return; }
  if (action === "removeopen") { card.classList.remove("editing"); openPop(btn, card); return; }
  if (action === "remove") extra = {reason: btn.dataset.reason, why: card.querySelector(".in-why").value};
  if (action === "swap") extra = {previous: view[day].one ? view[day].one.id : ""};
  if (action === "select" || action === "unselect") {
    // Live: the selection and the budget change at once; the server follows.
    const id = card.dataset.id, before = sel[day].slice();
    sel[day] = action === "select" ? (sel[day].includes(id) ? sel[day] : sel[day].concat(id)) : sel[day].filter(i => i !== id);
    render(); haptic();
    const secEl = card.closest("[data-sec]"), from = card.classList.contains("hero") ? "one" : (secEl ? secEl.dataset.sec : "");
    try { const res = await api("api/act", {id, action, from}); if (!testMode) load(); else if (res.msg) toast(res.msg); }
    catch (e) { sel[day] = before; render(); toast("Failed: " + e.message); }
    return;
  }
  if (action === "replied") text = (card.querySelector(".in-draft") || {}).value || "";
  if (action === "next") text = card.querySelector(".in-next").value;
  if (action === "note" || action === "talknote") text = card.querySelector(".in-note").value;
  if (["next", "note", "talknote"].includes(action) && !text.trim()) return;
  if (action === "talknote") action = "talk";
  const buttons = card.querySelectorAll("button");
  buttons.forEach(b => b.disabled = true);
  try {
    const res = await api("api/act", {id: card.dataset.id, action, text, ...extra});
    haptic(); toast(res.msg);
    if (res.close && inTg) { tg.close(); return; }
    if (testMode || res.keep || res.close) {
      buttons.forEach(b => b.disabled = false);
      card.classList.remove("editing");
      if (!testMode) load();
      return;
    }
    card.classList.add("gone");
    setTimeout(load, 380);
  } catch (e) {
    buttons.forEach(b => b.disabled = false);
    toast("Failed: " + e.message);
  }
});

render();
load(true);
// The Goals tab lives in its own file (Nov 5): jobs/checkin_app/goals.js.
(function () { const s = document.createElement("script"); s.src = base + "goals.js"; document.body.appendChild(s); })();
</script>
</body>
</html>
