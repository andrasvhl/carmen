<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carmen</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#F5F4F0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Carmen">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Design: the approved mock, Oct 30. */
  :root {
    --ground: #F5F4F0; --surface: #FFFFFF; --ink: #17171C; --ink2: #3A3A42; --muted: #5E5E66;
    --line: #EEEDE8; --soft: #F1F0EC; --accent: #2D4FD8; --accent-ink: #1F3AA8; --accent-soft: #EEF1FD;
    --amber-soft: #FBEFDF; --amber-ink: #8F4E08; --onaccent: #FFFFFF; --bar: rgba(255,255,255,.92);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #0F0F12; --surface: #1C1C21; --ink: #F2F2F5; --ink2: #D4D4DA; --muted: #A0A0A8;
      --line: #2A2A30; --soft: #2A2A30; --accent: #6F8BFF; --accent-ink: #A9B9FF; --accent-soft: #1E2547;
      --amber-soft: #3A2A12; --amber-ink: #F3C46B; --onaccent: #0F0F12; --bar: rgba(28,28,33,.92);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--ground); color: var(--ink);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, system-ui, sans-serif; }
  main { max-width: 560px; margin: 0 auto;
    padding: calc(16px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom)); }
  button { font: inherit; border: 0; cursor: pointer; }
  button.link { background: none; border: 0; padding: 0; height: auto; color: var(--accent); font: inherit; font-weight: 600; cursor: pointer; }
  /* iPhone: no double-tap zoom on taps, and 16px fields so focusing one never zooms */
  html, button, a, .item { touch-action: manipulation; }
  input, textarea { font-size: 16px !important; }
  button:disabled { opacity: .45; cursor: default; }

  .head { padding: 8px 4px 12px; display: flex; flex-direction: column; gap: 2px; }
  .head .sub { font-size: 13px; color: var(--muted); font-weight: 500; }
  .head .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  h1 { margin: 0; font-size: 32px; font-weight: 700; letter-spacing: -.02em; }
  h2 { margin: 18px 4px 8px; font-size: 15px; font-weight: 600; display: flex; justify-content: space-between; align-items: baseline; }
  h2 span { font-size: 13px; color: var(--muted); font-weight: 400; flex: 1; margin-left: 8px; }
  h2 .pill { height: 34px; }
  .pill { height: 40px; padding: 0 12px; border-radius: 12px; background: var(--surface); color: var(--accent);
    font-weight: 500; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }

  .banner { font-size: 13px; padding: 9px 12px; border-radius: 12px; margin: 0 0 12px; background: var(--surface); color: var(--muted); }
  .banner.test { background: var(--amber-soft); color: var(--amber-ink); }
  .banner a { color: var(--accent); font-weight: 600; text-decoration: none; }

  .card { background: var(--surface); border-radius: 18px; padding: 14px 16px; margin-bottom: 10px; }
  .hero { border-radius: 20px; padding: 18px; box-shadow: 0 1px 2px rgba(23,23,28,.06), 0 8px 24px rgba(23,23,28,.06); }
  .tag { display: inline-block; font-size: 11.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
    padding: 4px 8px; border-radius: 6px; background: var(--amber-soft); color: var(--amber-ink); }
  .tagline { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .title { font-weight: 600; line-height: 1.3; }
  .hero .title { font-size: 20px; letter-spacing: -.01em; margin-top: 10px; }
  .next { font-size: 14.5px; color: var(--ink2); margin-top: 6px; }
  .next b { color: var(--muted); font-weight: 400; }
  .why { font-size: 13px; color: var(--muted); margin-top: 8px; }
  .src { color: var(--muted); font-size: 12px; }
  .ask { background: var(--ground); border-radius: 12px; padding: 10px 12px; margin-top: 6px; }
  .askq { font-weight: 600; font-size: 14.5px; }
  .askopts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .askopts .addpill { width: auto !important; max-width: 100%; height: auto !important; min-height: 36px; border-radius: 10px !important; padding: 7px 12px !important; font-size: 14px !important; line-height: 1.3 !important; white-space: normal !important; text-align: left; }
  .askfree { display: flex; gap: 6px; margin-top: 8px; }
  .askfree input { flex: 1; min-width: 0; background: var(--surface); }
  .askfree .addpill { width: auto !important; border-radius: 10px !important; padding: 0 14px !important; font-size: 14px !important; }
  .waitbox { margin-top: 8px; background: var(--accent-soft); color: var(--accent-ink); border-radius: 10px; padding: 8px 10px; font-size: 13.5px; }
  .acts { display: flex; gap: 8px; margin-top: 12px; }
  .acts button { height: 44px; border-radius: 12px; padding: 0 14px; font-weight: 600; font-size: 14.5px; background: var(--soft); color: var(--ink); }
  .acts .primary { background: var(--accent); color: var(--onaccent); flex: 1; }
  .acts .soft { background: var(--accent-soft); color: var(--accent); }

  .list { background: var(--surface); border-radius: 18px; overflow: hidden; }
  .item { padding: 13px 16px; border-bottom: 1px solid var(--line); }
  .item:last-child { border-bottom: 0; }
  .item .top { display: flex; gap: 12px; align-items: flex-start; }
  .check { width: 26px; height: 26px; border-radius: 13px; border: 1.75px solid #B9B8B2; background: transparent; flex: none; margin-top: -1px; }
  .check:active { background: var(--accent-soft); }
  .item .body { flex: 1; min-width: 0; }
  .item .title { font-size: 15px; font-weight: 550; }
  .item .nx { font-size: 13px; color: var(--muted); margin-top: 2px; overflow-wrap: anywhere; }
  .item .est { font-size: 12px; color: var(--muted); flex: none; margin-top: 2px; }
  .item .more { display: none; }
  .item.open .more { display: block; }

  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 2px 0; }
  .chips button { height: 36px; border-radius: 10px; padding: 0 12px; font-size: 13px; font-weight: 500; background: var(--soft); color: var(--ink); }
  .chips button.on { background: var(--accent-soft); color: var(--accent); }

  .who { display: flex; align-items: center; gap: 10px; }
  .avatar { width: 36px; height: 36px; border-radius: 18px; background: var(--accent-soft); color: var(--accent-ink);
    font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex: none; }
  .who .name { font-weight: 600; }
  .who .via { font-size: 12.5px; color: var(--muted); }
  textarea.draft { display: block; width: 100%; box-sizing: border-box; border: 0; resize: vertical; font: inherit; font-size: 16px; min-height: 90px; }
  .draft { margin-top: 10px; background: var(--ground); border-radius: 12px; padding: 10px 12px; font-size: 14.5px; color: var(--ink2); white-space: pre-wrap; }
  .steps { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .steps .lbl { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .step { display: flex; gap: 8px; font-size: 14px; color: var(--ink2); }
  .step i { font-style: normal; width: 20px; height: 20px; border-radius: 10px; background: var(--accent-soft); color: var(--accent-ink);
    font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex: none; margin-top: 1px; }

  .edit { display: none; margin-top: 10px; }
  .editing .edit { display: block; }
  .edit label { font-size: 12px; color: var(--muted); display: block; margin: 8px 0 4px; }
  input, textarea { width: 100%; border: 0; border-radius: 12px; padding: 10px 12px; font: inherit; background: var(--ground); color: var(--ink); }
  textarea { min-height: 72px; resize: vertical; }
  .addbar { display: none; gap: 8px; margin-bottom: 12px; }
  .addbar.on { display: flex; }
  .addbar input { background: var(--surface); }
  .addbar button { height: 44px; padding: 0 16px; border-radius: 12px; background: var(--accent); color: var(--onaccent); font-weight: 600; }

  .seg { display: flex; background: var(--soft); border-radius: 12px; padding: 3px; margin: 0 0 12px; }
  .seg button { flex: 1; height: 38px; border-radius: 9px; background: none; color: var(--muted); font-weight: 600; font-size: 14px; }
  .seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(23,23,28,.12); }
  .cta { display: flex; justify-content: center; align-items: center; gap: 8px; width: 100%; height: 52px; margin-top: 16px;
    border-radius: 14px; background: var(--ink); color: var(--ground); font-weight: 600; font-size: 15.5px; }
  .plist .item .check { display: none; }
  .addpill { flex: none; height: 36px; padding: 0 14px; border-radius: 10px; background: var(--accent-soft); color: var(--accent);
    font-weight: 600; font-size: 13.5px; align-self: center; }
  .addpill.on, .acts .primary.on { background: var(--accent); color: var(--onaccent); }
  .addpill.ghost, .acts .primary.ghost { background: var(--soft); color: var(--ink); }
  .pair { display: flex; gap: 6px; flex: none; align-self: center; }
  .addpill .ico { display: none; }
  @media (max-width: 600px) {
    .pair { flex-direction: column; gap: 6px; align-self: flex-start; }
    .addpill { width: 40px; height: 40px; padding: 0; border-radius: 20px; font-size: 20px; line-height: 40px; }
    .addpill .lbl { display: none; }
    .addpill .ico { display: inline; }
    /* Done / Not done have no icon: small text chips, not 40 px circles (Oct 31) */
    .addpill.txt { width: auto; height: 34px; padding: 0 12px; border-radius: 17px; font-size: 14px; line-height: 34px; white-space: nowrap; }
    .item .top { gap: 10px; }
    /* 3 lines: as tall as the two stacked buttons, so the card wastes no space (Oct 30) */
    .item:not(.open) .nx { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  }
  /* Each row its own card, close together (Oct 30: "more card like without taking a lot more space") */
  .list { background: none; border-radius: 0; overflow: visible; display: flex; flex-direction: column; gap: 6px; }
  .item { background: var(--surface); position: relative; touch-action: pan-y pinch-zoom; border-radius: 14px;
    border: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 11px 14px;
    box-shadow: 0 1px 2px rgba(23,23,28,.05); }
  .item:last-child { border-bottom: 1px solid var(--line); }
  /* iOS Safari only sends taps on plain elements to a document listener when they look clickable */
  .item, [data-id], .item .top, .item .body { cursor: pointer; }
  .item.sw-add { background: var(--accent-soft); }
  .item.sw-rem { background: var(--amber-soft); }
  .item.sw-go.sw-add { background: #C9D3FA; }
  .item.sw-go.sw-rem { background: #F6D9B4; }
  .detail { margin-top: 10px; }
  /* Open card: the next step stays at the top in full, beside the buttons (no gap there),
     then the actions, then the details without a second copy of it (Oct 30) */
  .item .detail .dsec.dnext { display: none; }
  .item .more > .acts.small:first-child { margin-top: 10px; }
  .hero .detail { display: none; }
  .hero.open .detail { display: block; }
  .dgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 12px;
    background: var(--ground); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
  .dgrid label, .dsec label { display: block; font-size: 11.5px; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: .04em; margin-bottom: 1px; }
  .dsec { margin-top: 10px; font-size: 14px; color: var(--ink2); }
  .dsec .desc { white-space: pre-wrap; }
  .by { font-size: 11px; font-weight: 600; color: var(--accent); background: var(--accent-soft); padding: 2px 6px; border-radius: 5px; vertical-align: 2px; }
  .acts.small { margin-top: 8px; }
  .acts.small button { height: 36px; font-size: 13.5px; font-weight: 500; }
  .item .removebox { margin-top: 10px; }
  .item.removing .removebox { display: block; }
  /* Sticky, so the budget stays in view while scrolling (owner decision, Oct 30) */
  .bwrap { position: sticky; top: 0; z-index: 5; margin: 0 -16px 12px; padding: calc(8px + env(safe-area-inset-top)) 16px 8px;
    background: var(--ground); }
  .budget { background: var(--surface); border-radius: 14px; padding: 10px 14px; box-shadow: 0 6px 16px rgba(23,23,28,.08); }
  .budget .brow { display: flex; justify-content: space-between; font-size: 13.5px; }
  .budget .brow span { color: var(--muted); }
  .budget .bar { height: 6px; border-radius: 3px; background: var(--soft); margin-top: 8px; overflow: hidden; }
  .budget .bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .25s; }
  .budget.over .bar i { background: #C9771E; }
  .budget .bnote { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .budget.over .bnote:last-child { color: var(--amber-ink); font-weight: 600; }
  .removebox { display: none; margin-top: 10px; }
  .removing .removebox { display: block; }
  /* Remove as a vertical dropdown (owner decision, Oct 30) */
  .pop { position: fixed; z-index: 50; }
  /* Feel (Oct 30, "like Things 3"): things give way under the finger and move with a spring */
  button, .item, .card { transition: transform .14s cubic-bezier(.2,.8,.2,1), background-color .15s; }
  button:active:not(:disabled) { transform: scale(.94); }
  /* No press scale on cards: iOS marks every scroll touch as a press, so cards bounced while reading (Oct 30) */
  .pop.sheet { animation: sheetup .32s cubic-bezier(.2,.9,.25,1.05); }
  .pop.dialog { animation: popin .22s cubic-bezier(.2,.9,.3,1.1); }
  .pop.full { animation: fullin .28s cubic-bezier(.2,.9,.3,1); }
  .pop:not(.sheet):not(.dialog):not(.full) .removebox { animation: dropin .18s cubic-bezier(.2,.9,.3,1.1); transform-origin: top left; }
  .scrim:not([hidden]) { animation: fade .25s ease-out; }
  @keyframes sheetup { from { transform: translateY(100%); } to { transform: none; } }
  @keyframes popin { from { opacity: 0; transform: translate(-50%, -48%) scale(.96); } to { opacity: 1; transform: translate(-50%, -50%); } }
  @keyframes fullin { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
  @keyframes dropin { from { opacity: 0; transform: scale(.95) translateY(-4px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  /* A display rule (the full-screen edit page's flex) must never beat hidden: that left a black screen after Cancel */
  [hidden] { display: none !important; }
  .scrim { position: fixed; inset: 0; z-index: 49; background: rgba(0,0,0,.35); }
  .pop.sheet { left: 0; right: 0; top: auto; bottom: 0; width: auto; transition: top .18s ease-out; }
  .pop.sheet .removebox { border-radius: 18px 18px 0 0; padding: 8px 12px calc(12px + env(safe-area-inset-bottom)); border-bottom: 0; }
  .sheet-title { position: relative; z-index: 1; margin: 0 12px -4px; padding: 12px 4px 8px; font-weight: 600; font-size: 14px;
    color: var(--muted); background: var(--surface); border-radius: 18px 18px 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pop.sheet .sheet-title { margin: 0; padding: 14px 16px 6px; border: 1px solid var(--line); border-bottom: 0; }
  .pop.sheet .sheet-title + .removebox { border-radius: 0; border-top: 0; }
  body.kbd nav { display: none; }
  .pop.dialog { left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(440px, calc(100vw - 32px)); }
  .scrim { touch-action: none; }
  .pop.full { inset: 0; background: var(--ground); display: flex; flex-direction: column; }
  .pop.full .fullbar { flex: none; display: flex; align-items: center; justify-content: space-between;
    padding: calc(6px + env(safe-area-inset-top)) 8px 6px; border-bottom: 1px solid var(--line); background: var(--surface); }
  .pop.full .fullbar b { font-size: 16px; }
  .pop.full .fullbar button { background: none; color: var(--accent); font-size: 16px; height: 44px; padding: 0 10px; }
  .pop.full .fullbar .strong { font-weight: 700; }
  .pop.full .editform { flex: 1; max-height: none; border: 0; border-radius: 0; box-shadow: none; background: var(--ground);
    padding: 8px 16px calc(24px + env(safe-area-inset-bottom)) !important; }
  .pop.full .editform .whyhead { margin-top: 6px; }
  .pop.full .editform textarea, .pop.full .editform input { background: var(--surface); }
  .pop.sheet .removebox { overflow-y: auto; overscroll-behavior: contain; }
  .editform { max-height: 85vh; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding: 14px 14px calc(14px + env(safe-area-inset-bottom)) !important; }
  .editform label { display: block; font-size: 11.5px; font-weight: 600; color: var(--muted); text-transform: uppercase;
    letter-spacing: .04em; margin: 10px 0 4px; }
  .editform textarea, .editform input { background: var(--ground); }
  /* iOS gives date inputs an intrinsic width that pushed Scheduled past the edge (Oct 31) */
  .editform .frow > div { min-width: 0; }
  .editform input[type="date"] { -webkit-appearance: none; appearance: none; width: 100%; min-width: 0; box-sizing: border-box; display: block; }
  .editform .fstatus button { font-size: 13px; padding: 0 4px; }
  .editform .frow { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .editform .seg { margin: 0; }
  .sendform .sfrom button { font-size: 12.5px; padding: 0 4px; }
  .sendform .s-body { min-height: 180px; }
  .sendform .linkbtn { background: none; color: var(--accent); padding: 0; height: auto; font-size: inherit; font-weight: 600; }
  .sendform .s-warn { color: var(--ink); font-weight: 600; }
  .sendform .s-hist, .sendform .s-rel { margin-top: 8px; font-size: 13.5px; }
  .sendform .s-rel { margin-top: 16px; }
  .sendform .s-hist .lbl, .sendform .s-rel .lbl { font-size: 11.5px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 8px 0 4px; }
  .sendform .hmsg { background: var(--soft); border-radius: 10px; padding: 7px 10px; margin-bottom: 5px; color: var(--ink2); }
  .sendform .hrel { display: block; padding: 6px 0; border-bottom: 1px solid var(--line); color: var(--ink); text-decoration: none; }
  .sendform .hrel small { display: block; color: var(--muted); }
  .sendform .s-held { margin-top: 10px; background: var(--soft); border-radius: 12px; padding: 8px 10px; font-size: 13.5px; }
  .editform .acts button { flex: 1; }
  .journal .jcheck { display: flex; gap: 10px; align-items: center; text-transform: none; letter-spacing: 0; font-size: 15px;
    font-weight: 500; color: var(--ink); margin: 6px 0; }
  .journal .jcheck input { width: 22px; height: 22px; }
  .whystep { padding: 14px 14px calc(12px + env(safe-area-inset-bottom)) !important; }
  .whyhead { font-weight: 600; font-size: 15px; margin-bottom: 8px; }
  .whystep .acts button { flex: 1; }
  .pop .removebox { display: block; margin: 0; }
  .removebox { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 8px;
    box-shadow: 0 12px 32px rgba(23,23,28,.18); }
  .removebox .in-why { margin-top: 6px; }
  .pop .removebox { padding: 4px; }
  .reasons { display: flex; flex-direction: column; }
  .reasons button { text-align: left; min-height: 48px; padding: 8px 10px; border-radius: 10px; background: none;
    color: var(--ink); font-weight: 600; font-size: 15px; display: flex; flex-direction: column; justify-content: center; }
  .reasons button + button { border-top: 1px solid var(--line); border-radius: 0; }
  .reasons button:active { background: var(--soft); }
  .reasons small { font-size: 12.5px; color: var(--muted); font-weight: 400; margin-top: 1px; }
  .empty { text-align: center; color: var(--muted); padding: 40px 16px; }
  .zen { text-align: center; padding: 28px 16px 36px; }
  .zen-svg { width: 168px; height: 168px; display: block; margin: 0 auto 6px; overflow: visible; }
  .zen-enso { fill: none; stroke: var(--ink); stroke-width: 7; stroke-linecap: round; opacity: .88; }
  .zen-enso.thin { stroke-width: 2.2; opacity: .35; }
  .zen-ring { fill: none; stroke: var(--accent); stroke-width: 1.2; opacity: 0; transform-origin: 80px 80px; }
  .zen-dot { fill: var(--accent); opacity: .7; }
  .zen-h { font-size: 22px; font-weight: 650; letter-spacing: -.01em; color: var(--ink); }
  .zen-s { color: var(--muted); margin-top: 6px; font-size: 15px; line-height: 1.45; max-width: 340px; margin-left: auto; margin-right: auto; }
  .zen.play .zen-enso { stroke-dasharray: 100; stroke-dashoffset: 100; animation: zen-draw 1.9s cubic-bezier(.55,.05,.35,1) .25s forwards; }
  .zen.play .zen-enso.thin { animation-delay: .45s; }
  .zen.play .zen-ring { animation: zen-ripple 3.2s ease-out 2s forwards; }
  .zen.play .zen-ring.r2 { animation-delay: 2.7s; }
  .zen.play .zen-dot { opacity: 0; animation: zen-in .8s ease 1.9s forwards; }
  .zen.play .zen-svg { animation: zen-breathe 4s ease-in-out 2.2s 2; }
  .zen.play .zen-h, .zen.play .zen-s { opacity: 0; transform: translateY(6px); animation: zen-rise .9s ease 2.1s forwards; }
  .zen.play .zen-s { animation-delay: 2.5s; }
  @keyframes zen-draw { to { stroke-dashoffset: 0; } }

  /* QA Nov 8 no-brainers (Nov 9): presentation only, nothing a tap does changes. */
  /* A band behind the status bar, so scrolled text never runs under the clock (home-screen app, iPhone frame). */
  body::before { content: ""; position: fixed; left: 0; right: 0; top: 0; height: env(safe-area-inset-top);
    background: var(--ground); z-index: 45; pointer-events: none; }
  /* Links that set no colour were the browser's dark blue, unreadable on dark cards. */
  a { color: var(--accent); }
  .tp-ws a { color: var(--accent); }
  /* Empty date fields keep a field's height (they collapsed to a thin bar on iOS). */
  input[type="date"] { min-height: 44px; line-height: 24px; }
  input[type="date"]::-webkit-date-and-time-value { min-height: 24px; text-align: left; }
  /* Small text links get a 44 pt tap area without moving anything around them. */
  button.link, .refresh, .banner a, .head a.link { position: relative; }
  button.link::after, .refresh::after, .banner a::after, .head a.link::after { content: ""; position: absolute;
    left: -4px; right: -4px; top: 50%; height: 44px; transform: translateY(-50%); }
  /* Ticked steps read as done, not as links. */
  .dplan li.done { color: var(--muted); }
  .dplan li.done::first-letter { color: #1F7A3A; }
  /* "THE ONE THING" never breaks in two; its meta wraps under it instead. */
  .tag { white-space: nowrap; }
  .tagline { flex-wrap: wrap; row-gap: 4px; }
  /* "Plan not booked yet" lost its padding and gap to the list .dplan rule and sat glued to the card below. */
  .dstep.dplan { margin: 0 0 10px; padding: 10px 14px; font-size: 13.5px; line-height: 1.45; color: var(--ink); }
  /* Reply drafts grow with their text (autoGrow), so no line is cut off before Copy. */
  textarea.draft.in-draft { resize: none; overflow-y: hidden; }
  /* Chat lists: real bullets with a hanging indent; a draft is text with a Copy button, not a code box. */
  .msg ul.mdl { margin: 4px 0; padding-left: 18px; white-space: normal; }
  .msg ul.mdl li { margin: 2px 0; white-space: pre-wrap; }
  .msg .mddraft { position: relative; margin: 6px 0; padding: 9px 11px 9px 11px; border-radius: 10px; background: var(--ground);
    white-space: pre-wrap; font-size: 14.5px; line-height: 1.4; }
  .msg .mddraft .mdcopy { display: block; margin-top: 6px; height: 30px; padding: 0 12px; border-radius: 8px;
    background: var(--accent-soft); color: var(--accent); font-size: 13px; font-weight: 600; }
  /* A sent screenshot is a rounded thumbnail, not a big blue slab. */
  .msg img.cpic { max-height: 200px; max-width: 220px; }
  .msg.you:has(.cpics):not(:has(.ctext)) { background: none; padding: 0; }
  .msg.you .cpics { justify-content: flex-end; }
  /* The plan request in the Plan chat: the list he planned, folded, not Claude's instructions. */
  .msg.you.planmsg { white-space: normal; }
  .msg.you.planmsg summary { cursor: pointer; list-style: none; font-weight: 600; }
  .msg.you.planmsg summary::-webkit-details-marker { display: none; }
  .msg.you.planmsg ol { margin: 6px 0 0; padding-left: 20px; font-size: 14px; }

          font-size: 12px; font-weight: 700; line-height: 22px; text-align: center; box-sizing: border-box; }

// Offline (QA Nov 8, P1: a Remove with the connection cut closed the sheet, was never applied and
// said nothing). Every call gives up after API_TIMEOUT_MS instead of hanging. A tap made while the
// phone knows it is offline was certainly not sent, so it waits on this phone (localStorage
// carmen-offq) with a chip, and is sent when the connection is back, in order, the same Carmen day
// only. A call that fails after it may have reached the server is never resent (it could tick a step
// twice); it says so instead. Sends, Claude runs and chat turns are never queued.
const API_TIMEOUT_MS = 45000;
const OFFQ_KEY = "carmen-offq";
const QUEUEABLE = new Set(["remove", "notone", "step_done", "step_undo", "subtick", "tick_line", "done", "tomorrow",
  "select", "unselect", "replied", "skipreply", "skipreply_undo", "journal_save", "next", "note", "mark", "schedule",
  "not_waiting", "do_add", "do_drop", "do_keep", "do_dismiss", "do_unmove", "do_partclose"]);
function offqLoad() { try { return JSON.parse(store(OFFQ_KEY) || "[]"); } catch (e) { return []; } }
function offqSave(q) { store(OFFQ_KEY, q.length ? JSON.stringify(q) : null); paintOffq(); }
function paintOffq() {
  const el = document.getElementById("offq");
  if (!el) return;
  const n = offqLoad().length;
  el.hidden = !n;
  if (n) el.innerHTML = `${n} change${n > 1 ? "s" : ""} waiting for a connection<button data-offq="send">Send now</button>`;
}
function offlineError(msg) { const e = new Error(msg); e.offline = true; return e; }
function apiBody(body) {
  return JSON.stringify({day: ["today", "plan"].includes((body && body.tab) || tab) ? day : "today",
                         ...body, test: testMode, tab: (body && body.tab) || tab});
}
async function apiFetch(path, init) {
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), API_TIMEOUT_MS);
  try { return await fetch(base + path, {...init, signal: ctl.signal}); }
  catch (e) {
    throw offlineError(e && e.name === "AbortError" ? "no answer from Carmen, it may not be saved; refresh to check"
                                                    : "no connection, it may not be saved; refresh to check");
  } finally { clearTimeout(timer); }
}
async function api(path, body) {
  const json = body ? apiBody(body) : undefined;
  if (body && path === "api/act" && navigator.onLine === false && !testMode && QUEUEABLE.has(body.action)) {
    const q = offqLoad();
    q.push({json, at: Date.now(), cday: carmenDay().toDateString(), action: body.action});
    offqSave(q);
    throw offlineError("queued");
  }
  const r = await apiFetch(path, {
    method: body ? "POST" : "GET",
    headers: {"x-init-data": initData, "content-type": "application/json"},
    body: json,
  });
  const j = await r.json().catch(() => ({}));
  if (r.status === 403 && !inTg) { location.href = base + "login"; throw new Error("sign in"); }
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}
let offqBusy = false;
async function offqSend() {
  if (offqBusy || navigator.onLine === false) return;
  let q = offqLoad();
  if (!q.length) return;
  offqBusy = true;
  const today = carmenDay().toDateString();
  let sent = 0, stale = 0, failed = 0;
  try {
    while (q.length) {
      const item = q[0];
      if (item.cday !== today) { stale++; q.shift(); offqSave(q); continue; }   // a tap from another day means something else now
      let r;
      try {
        r = await apiFetch("api/act", {method: "POST", headers: {"x-init-data": initData, "content-type": "application/json"}, body: item.json});
      } catch (e) { break; }   // still offline: keep it, try again later
      if (r.ok) sent++; else failed++;   // refused (the note changed since): dropped, said below
      q.shift(); offqSave(q);
    }
  } finally { offqBusy = false; }
  if (sent || stale || failed) {
    toast([sent ? `${sent} waiting change${sent > 1 ? "s" : ""} sent` : "",
           failed ? `${failed} refused, the task changed meanwhile` : "",
           stale ? `${stale} from an earlier day dropped` : ""].filter(Boolean).join(" · "), true);
    load();
  }
}
window.addEventListener("online", () => setTimeout(offqSend, 800));
document.addEventListener("visibilitychange", () => { if (!document.hidden) offqSend(); });
document.addEventListener("click", e => {
  if (!e.target.closest("[data-offq]")) return;
  e.preventDefault(); e.stopPropagation();
  if (navigator.onLine === false) toast("Still offline, it sends by itself when you're back", true); else offqSend();
}, true);

const esc = s => (s || "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let toastTimer;
function toast(msg, always) {
  // Only what the screen does not already show: errors, sends, updates (Oct 30).
  // Test mode says what it would have done (Nov 6: "Test mode, nothing written" matched no keyword,
  // so test-mode taps showed nothing at all).
  if (msg === "Failed: queued") { msg = "Offline: kept on this phone, sends when you're back"; always = true; }
  else if (/^Failed: no (connection|answer)/.test(msg || "")) msg = msg.replace(/^Failed: n/, "N");
  if (!always && !/fail|sent|would send|copied|telegram|updat|claude|plan|over|could not|test mode|offline|no connection|no answer/i.test(msg || "")) return;
  const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("on"), 2400);
}
// A toast with Undo (Nov 9): every tick on the face, every Clear and Back to today. A new one
// replaces the old; they never stack.
function toastUndo(msg, undo) {
  const t = document.getElementById("toast");
  t.innerHTML = `<span>${esc(msg)}</span> <button class="toastundo">Undo</button>`;
  t.classList.add("on", "act");
  t.querySelector(".toastundo").onclick = async e => { e.stopPropagation(); t.classList.remove("on", "act"); try { await undo(); } catch (x) { toast("Failed: " + x.message); } };
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("on", "act"), 5000);
}
async function tickStep(el) {
  const card = el.closest("[data-id]"), id = card && card.dataset.id, sid = el.dataset.tick, on = el.dataset.on === "1";
  const r = id && doRow(id);
  if (!r || !sid) return;
  el.disabled = true; haptic();
  // Read the row fresh each time (round 4): after an untick the step is the Next again, so its redo
  // must promote the following step exactly as the first tick did.
  const tick = () => { const rr = doRow(id) || r; return api("api/act", sid === ((rr.detail || {}).next_id || "")
    ? {id, action: "step_done", tab: "do", over: rr.wait_back ? 1 : 0} : {id, action: "tick_line", text: "", sid}); };
  const untick = () => api("api/act", {id, action: "step_untick", sid});
  const sync = async () => { lastJson = null; await load(); if (chat && chat.panel && typeof refreshTask === "function") refreshTask(); };
  try {
    if (on) { const res = await untick(); toastUndo(res && res.task_reopened ? "Task reopened" : "Step reopened", async () => { await tick(); await sync(); }); }
    else { const res = await tick(); toastUndo(res && res.state === "done" ? "Task closed" : "Step done", async () => { await untick(); await sync(); }); }
    await sync();

}
async function tickPart(el) {
  // A part of the Next step, ticked on the face like in the opened card; the last part ticks the step.
  const card = el.closest("[data-id]"), id = card && card.dataset.id, r = id && doRow(id);
  if (!r) return;
  const n = +el.dataset.part, parts = stepParts(r.next).length, done = subDone(r), on = !done.has(n);
  on ? done.add(n) : done.delete(n);
  const sid = (r.detail || {}).next_id || "";
  view.subticks = view.subticks || {}; view.subticks[r.id] = {sid, next: r.next, done: [...done]};
  lastJson = null; render(); haptic();
  try {
    await api("api/act", {id, action: "subtick", next: r.next, sid, n, on});
    const whole = on && done.size >= parts;
    let res = null;
    if (whole) res = await api("api/act", {id, action: "step_done", tab: "do"});
    // Undo is the exact inverse: the step the last part completed opens again (its other parts stay).
    toastUndo(whole && res && res.state === "done" ? "Task closed" : whole ? "Step done" : on ? "Part done" : "Part reopened", async () => {
      if (whole) await api("api/act", {id, action: "step_untick", sid});
      else await api("api/act", {id, action: "subtick", next: r.next, sid, n, on: !on});
      lastJson = null; await load();
    });
    lastJson = null; await load();
  } catch (e) { toast("Failed: " + e.message); }
}
async function clearCards(ids) {

  const undo = doLocal(d => {
    const off = (d.rows || []).concat(d.part_done || []).filter(x => set.has(x.id));
    d.rows = (d.rows || []).filter(x => !set.has(x.id)); d.part_done = (d.part_done || []).filter(x => !set.has(x.id));
    d.cleared = off.map(x => ({...x, cleared_state: {finished: !!x.fin, closed: (x.fin || {}).kind === "closed",
      done: (x.plan || (x.chunk || {}).plan || []).filter(p => p.state === "done" || p.state === "waiting").length,
      total: (x.plan || (x.chunk || {}).plan || []).length}})).concat(d.cleared || []);
  });
  haptic();
  if (chat && chat.panel && set.has(chat.id) && typeof refreshTask === "function") refreshTask();
  const res = await doTap({id: ids[0], ids, action: "do_clear", from: "do"}, undo);
  if (res) toastUndo(ids.length > 1 ? `Cleared ${ids.length} from today` : "Cleared from today", () => backCards(ids, true));
}

// Swipe left on a Do card (Nov 9): reveals a labelled Clear; only a tap on it commits, so a stray
// scroll never clears a card. One open at a time; scrolling or tapping elsewhere closes it.
(function swipeClear() {
  let card = null, x0 = 0, y0 = 0, dx = 0, on = false;
  const shut = c => { if (c) { const tp = c.querySelector(".top"); if (tp) tp.style.transform = ""; c.classList.remove("swiped"); } };
  document.addEventListener("touchstart", e => {
    const c = e.target.closest(".doitem");
    document.querySelectorAll(".doitem.swiped").forEach(x => { if (x !== c) shut(x); });
    if (!c || e.target.closest("button, a, input, textarea")) { card = null; return; }
    card = c; x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; dx = 0; on = false;
  }, {passive: true});
  document.addEventListener("touchmove", e => {
    if (!card) return;
    const mx = e.touches[0].clientX - x0, my = e.touches[0].clientY - y0;
    if (!on && Math.abs(mx) > 12 && Math.abs(mx) > 2 * Math.abs(my)) on = true;
    if (!on) return;
    e.preventDefault();
    card.classList.add("swiping");
    const base = card.classList.contains("swiped") ? -96 : 0;
    dx = Math.max(-110, Math.min(0, base + mx));
    const tp = card.querySelector(".top"); if (tp) { tp.style.transition = "none"; tp.style.transform = `translateX(${dx}px)`; }
  }, {passive: false});
  document.addEventListener("touchend", () => {
    if (!card || !on) { card = null; return; }
    card.classList.remove("swiping");
    const tp = card.querySelector(".top"); if (tp) tp.style.transition = "";
    if (dx < -48) { card.classList.add("swiped"); if (tp) tp.style.transform = "translateX(-96px)"; } else shut(card);
    card = null;
  });
  window.addEventListener("scroll", () => document.querySelectorAll(".doitem.swiped").forEach(shut), {passive: true});
})();

function placeSheet() {
  const pop = document.getElementById("pop"), vv = window.visualViewport;
  if (!popCard || !pop.classList.contains("sheet") || !vv) return;
  // Placed from the top of what is visible, so iOS shifting the page cannot push the
  // sheet under the keyboard (Oct 30: "already done ... hidden below keyboard").
  const box0 = pop.firstElementChild;

  // The sheet never grows past what is visible above the keyboard (Oct 30: typing at

  const box = pop.querySelector(".editform") || pop.querySelector(".removebox");
  if (box) box.style.maxHeight = Math.max(160, vv.height - 24) + "px";

async function saveEdit(send) {

    if (q(".f-nextmin").value.trim() !== nm) fields.next_min = q(".f-nextmin").value.trim();

  const run = () => { queued = false; try { fixLinks(document.body); } catch (e) {} };
  const start = () => {
    run();
    new MutationObserver(() => { if (!queued) { queued = true; requestAnimationFrame(run); } })
      .observe(document.body, {childList: true, subtree: true, characterData: true});
  };

})();
// A step's parts (Nov 3, the owner: "one sentence short ... with like empty bullet on the left"):
// split at "; ", ", then", ", and" and at ", <verb>", never inside brackets; what is in brackets
// moves to a small line below. Display only: the note keeps the step as written.
const STEP_VERBS = new Set("take handwrite bring have send email mail check book pay ask call write open print scan upload fill reply text add confirm pick go buy pack get find read sign submit tell offer review draft move set put cancel order register drop collect share forward attach update message whatsapp".split(" "));
const TIME_LEAD = /^(?:by|on|before|after|until|till|from|at|around)\s/i;   // a lead-in, not a step: "By Nov 12", "Before the call with the bank"
function stepParts(text) {
  const due = dueIso(text);
  const t = stripDue(clean(text || "")).replace(NOMIN, "").trim();
  const parts = []; let cur = "", depth = 0, tail = "";
  for (let i = 0; i < t.length; i++) {
    const ch = t[i];
    if (ch === "(" || ch === "[") depth++;
    if ((ch === ")" || ch === "]") && depth) depth--;
    if (!depth) {
      const rest = t.slice(i);
      // A colon introduces what the step contains, not more steps (Nov 3, the owner: the trek flight
      // form's flights showed as four checkboxes). The rest goes to the small line, unsplit.
      const colon = /^:\s+/.exec(rest);
      if (colon && cur.trim()) { tail = rest.slice(colon[0].length).trim(); break; }
      let m = /^;\s+/.exec(rest) || /^,\s+(?:and\s+)?then\s+/i.exec(rest) || /^,\s+and\s+(?=\S+\s+\S)/i.exec(rest);
      if (!m) { const v = /^,\s+(\w+)/.exec(rest); if (v && STEP_VERBS.has(v[1].toLowerCase())) m = /^,\s+/.exec(rest); }
      if (m) { parts.push(cur); cur = ""; i += m[0].length - 1; continue; }
    }
    cur += ch;
  }
  parts.push(cur);
  // A fragment of one or two words ("While there") belongs to the part after it, and so does a
  // short time phrase ("By Nov 12", "On Friday morning"; Nov 4, a flight refund step split into
  // "By Nov 12" and "Confirm the refund landed").
  const merged = [], joined = [];   // a lead-in joins one part, never a chain of them
  parts.map(s => s.trim()).filter(Boolean).forEach(s => {
    const k = merged.length - 1, last = merged[k], n = k < 0 ? 0 : last.split(/\s+/).length;
    if (k >= 0 && !joined[k] && (n < 3 || (n <= 7 && TIME_LEAD.test(last)))) { merged[k] = last + ", " + s; joined[k] = true; }
    else { merged.push(s); joined.push(false); }
  });

    const det = [];
    const main = s.replace(/(?<!\])\s*\(([^()]*)\)/g, (_, x) => { det.push(x); return ""; }).replace(/\s+([,.;:])/g, "$1").trim();
    return {main: capFirst(main), detail: det.join(" · ")};
  });
  if (tail && out.length) { const last = out[out.length - 1]; last.detail = [tail, last.detail].filter(Boolean).join(" · "); }
  if (due && out.length) { const last = out[out.length - 1]; last.detail = [last.detail, "due " + dueLabel(due)].filter(Boolean).join(" · "); }
  return out;
}
// The Today fold's lines: ticked parts of a Next step (today's subticks), then the Log's wins.
function todayWins(dayIso) {
  const w = view.wins || {items: []}, parts = [];
  Object.entries(view.subticks || {}).forEach(([task, e]) => {
    if (!e || e.at !== dayIso) return;
    const ps = stepParts(e.next);
    (e.done || []).forEach(n => { if (ps[n]) parts.push({t: ps[n].main, task}); });
  });
  // A step whose parts are listed is not listed again as a whole
  const seen = new Set(Object.values(view.subticks || {}).filter(e => e && e.at === dayIso)
    .map(e => clean(e.next).replace(NOMIN, "").trim()));
  // One event logged in two notes is one win, already here, so the chip's count is the list's
  // length (Nov 6: "Progress today 5" listed 4, the count was taken before winsHtml's dedupe).
  const kept = [];
  const items = parts.concat((w.items || []).filter(x => !seen.has(x.t))).filter(x => {
    const k = winKey(x.t);
    const dup = k.nums.size && kept.some(o => [...k.nums].some(n => o.nums.has(n)) && [...k.names].some(n => o.names.has(n)));
    if (!dup) kept.push(k);
    return !dup;
  });
  return {items, n: items.length, claude: w.claude_steps || 0, tasks: w.claude_tasks || 0};
}
// Progress today grouped by task (Nov 3, the owner: "so substeps stay grouped by task"): the task
// as a heading, its wins below as short lines; the task with the latest win first.
// One event logged in two notes is one win (Nov 3, the owner: "Ari thing appears twice"; "Ari
// already paid his $333 share" and "Shares settled: Ari also paid the owner $333"): a later win
// naming the same person and the same amount as an earlier one is left out.
function winKey(t) {
  const s = String(t || "");
  const names = (s.match(/\b[A-Z][a-z]{1,}\b/g) || []).filter(x => !/^(the owner|Claude|Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec|Mon|Tue|Wed|Thu|Fri|Sat|Sun)$/.test(x));
  const nums = (s.match(/\$?\d[\d,.]{2,}/g) || []).map(x => x.replace(/[$,]/g, "")).filter(x => !/^\d{1,2}[.:]\d{2}$/.test(x));
  return {names: new Set(names), nums: new Set(nums)};
}
function winsHtml(wins) {
  const groups = new Map(), kept = [];
  wins = {...wins, items: wins.items.filter(w => {
    const k = winKey(w.t);
    const dup = k.nums.size && kept.some(o => [...k.nums].some(n => o.nums.has(n)) && [...k.names].some(n => o.names.has(n)));
    if (!dup) kept.push(k);
    return !dup;
  })};
  wins.items.forEach(w => { if (!groups.has(w.task)) groups.set(w.task, []); groups.get(w.task).push(w); });
  const short = s => { const x = String(s || "").split(/;\s|\s→\s|\s->\s/)[0].trim(); return x.length > 110 ? x.slice(0, 108) + "…" : x; };
  return `<div class="dwins">${[...groups].map(([task, ws]) => `<div class="dwgrp"><div class="dwtask">${esc(task)}<span>${ws.length}</span></div>
    ${ws.map(w => `<div class="dwin${w.big ? " big" : ""}"><i>✓</i><span>${linkBare(md(short(w.t)))}</span></div>`).join("")}</div>`).join("")}${wins.claude
    ? `<div class="dwin claude"><i>✦</i><span>Claude also did ${wins.claude} prep step${wins.claude === 1 ? "" : "s"} on ${wins.tasks} task${wins.tasks === 1 ? "" : "s"}</span></div>` : ""}</div>`;
}
// An id such as O-3UB211351F741460T or PRIV-2026-WEB never breaks at its hyphens (Nov 10 sheet
// review): its hyphens become non-breaking ones, display only.
const keepIds = s => String(s || "").replace(/\b[A-Z0-9]{1,}(?:-[A-Z0-9]{2,})+\b/g, m => /\d/.test(m) && m.length >= 8 ? m.replace(/-/g, "‑") : m);
// A step's meta line in the opened card (Nov 10, Do/Plan system): its minutes, its due date (red

// the "due …" part leaves the small line, so the date shows once.
function stepMeta(r, s, sid) {

  const w = sid && (d.blocked || []).includes(sid) ? (d.waits || []).find(x => (x.blocks || []).includes(sid)) : null;
  const due = !di ? "" : di < today ? `<span class="ps-due">Overdue since ${esc(shortDate(di))}</span>`
    : di === today ? '<span class="ps-due">Due today</span>' : `<span>Due ${esc(dueLabel(di))}</span>`;
  const o = stepOrder(r), held = o && sid ? (o.held || {})[sid] : "";
  const bits = [m ? `<span>${esc(estText(m))}</span>` : "", due, w ? `<span>Waiting on ${esc(w.who || waitWho(w.text))}</span>` : "",
    o && isOpt(s) ? "<span>If there's time</span>" : "", held ? `<span>Not before ${esc(held.replace(/^from /, ""))}</span>` : "",
    // A step after his own step (Nov 11): a quiet "after part 1", never "Waiting on …".
    !w && sid && (d.after_label || {})[sid] ? `<span>${esc(d.after_label[sid])}</span>` : ""].filter(Boolean);

}
function checkItem(x, on, attrs, discard, extra, meta) {

  return `<li class="${on ? "on" : ""}"><button class="tp-box dcirc${on ? " on" : ""}" ${attrs} aria-label="${on ? "Not done" : "Mark done"}">${TICK_SVG}</button>
    <span class="tp-txt">${linkBare(md(keepIds(x.main)))}${det ? `<small>${linkBare(md(keepIds(det)))}</small>` : ""}${meta || ""}${extra || ""}</span>${discard ? `<button class="tp-x" data-tp="discard" ${discard} aria-label="Discard this step" title="Discard this step">×</button>` : ""}</li>`;

// A step's workspace (Nov 4, the owner: "the small workspace for the substep where relevant

// The Done zone (Nov 9): every finished step not already in Today, newest first. Today's steps
// past the plan lead, with "Claude" on the ones a chat ticked; then the history, matched by words
// since Log lines carry no step id.
function doneZone(r, list) {
  const plan = (r.chunk && r.chunk.plan) || r.plan || [], extra = (r.chunk && r.chunk.extra) || r.extra || [];
  if (!plan.length || !plan.every(x => x.id)) return doneStepsHtml(list);

// The steps in the task column (Nov 3, the owner: "chunked next steps grouped in the side bar as

// chunk (opened outside Do) keeps Next step and After that.

    ${later.length ? `<details class="tp-after tp-later"${chat && chat.split ? " open" : ""}><summary>Later · ${later.length} step${later.length > 1 ? "s" : ""}</summary><ul class="tp-check">${later.map(([s, n]) => lineItem(s, n, true)).join("")}</ul></details>` : ""}`;

function committedSections(r, steps, plan, extra, nextList, lineItem) {

    ? `<div class="tp-nexts"><label>Next steps · ${total}<button class="link" data-tp="stepsedit">Edit</button></label>${nextOpen ? nextList : ""}

        ${moreRest.length ? `<details class="tp-more"><summary>Show ${moreRest.length} more</summary><ul class="tp-check">${moreRest.map(([s, n]) => lineItem(s, n, false)).join("")}</ul></details>` : ""}</div>`

const PDF_MAX = 12 * 1024 * 1024;
const isPdfFile = f => f.type === "application/pdf" || (!f.type && /\.pdf$/i.test(f.name || ""));
function pdfLabel(u) {
  const m = /[?&]p=([^&]+)/.exec(u || "");

async function shrinkImage(file) {
  if (file.size <= IMG_KEEP && /^image\/(png|jpeg|webp|gif)$/.test(file.type)) return file;
  const url = URL.createObjectURL(file);
  try {
    // Chrome cannot decode HEIC (iPhone photos AirDropped to the Mac, Nov 3), so say what to do
    const im = await new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i);
      i.onerror = () => bad(new Error(/hei[cf]/i.test(file.type + file.name)
        ? "HEIC cannot be read here, export it as JPEG first" : "could not read " + (file.name || "the image")));
      i.src = url; });
    const k = Math.min(1, IMG_SIDE / Math.max(im.naturalWidth, im.naturalHeight));
    const cv = document.createElement("canvas");
    cv.width = Math.round(im.naturalWidth * k); cv.height = Math.round(im.naturalHeight * k);
    cv.getContext("2d").drawImage(im, 0, 0, cv.width, cv.height);
    return await new Promise(ok => cv.toBlob(ok, "image/jpeg", 0.85));
  } finally { URL.revokeObjectURL(url); }
}
async function addImages(files) {

  const all = Array.from(files || []), skip = all.filter(f => !ok(f));
  if (skip.length) toast(`Could not attach ${skip.map(f => f.name || "that file").join(", ")}: only images and PDFs`);
  for (const f of all.filter(ok)) {

    const pdf = isPdfFile(f);

    const item = pdf ? {pdf: (f.name || "Document").replace(/\.pdf$/i, "")} : {local: URL.createObjectURL(f)};

function talkRelease() {

  talk.mr = null;

  talkShell().style.setProperty("--lvl", 0);
}

}

}

}

    catch (e) { talkUi("idle", micError(e)); return; }
  }

  talk.stream.getAudioTracks().forEach(t => { t.enabled = true; });
  const type = ["audio/mp4", "audio/webm;codecs=opus", "audio/webm", "audio/ogg;codecs=opus"]
    .find(t => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || "";
  const mr = new MediaRecorder(talk.stream, type ? {mimeType: type} : undefined);
  talk.mr = mr; talk.chunks = [];
  mr.ondataavailable = ev => { if (ev.data && ev.data.size) talk.chunks.push(ev.data); };
  mr.start(250);

  let an = null, buf = null;

    try { if (talk.ctx.state !== "running") await talk.ctx.resume(); const src = talk.ctx.createMediaStreamSource(talk.stream);

      const rms = Math.sqrt(sum / buf.length);

      if (spoke && now - lastLoud > TALK_QUIET_MS && lastLoud - spoke > 250) { talkSend(); return; }
    }
    if (spoke && now - spoke > TALK_MAX_MS) { talkSend(); return; }

      const j = await res.json().catch(() => ({}));

// Carmen speaks (Nov 8, speech.py on vault-host): the speaker on a reply fetches
// api/chat/tts for that message and plays it; a second tap stops it. After a voice message the
// reply plays by itself (chat.speakAfter). iOS plays sound only from a tap, so every tap that can
// lead to sound (the speaker, Send on a recording) first plays a silent clip on the one shared
// <audio>; that element may then play the reply when it arrives.
const SPK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';

}

}

// Voice messages (Oct 31): MediaRecorder in the page (m4a on the iPhone, webm in Chrome), sent

// audio, and the transcript continues the chat as his message.
let rec = null;
const REC_MAX_S = 300;
async function startRec() {
  if (!chat || rec) return;
  if (!navigator.mediaDevices || !window.MediaRecorder) { toast("Voice could not start here; the keyboard's dictation works"); return; }
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({audio: true}); }
  catch (e) { toast(micError(e), true); return; }
  if (!chat) { stream.getTracks().forEach(t => t.stop()); return; }
  const type = ["audio/mp4", "audio/webm;codecs=opus", "audio/webm", "audio/ogg;codecs=opus"]
    .find(t => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || "";
  const mr = new MediaRecorder(stream, type ? {mimeType: type} : undefined);
  rec = {mr, stream, chunks: [], t0: Date.now(), send: false, chat};
  mr.ondataavailable = e => { if (e.data && e.data.size && rec) rec.chunks.push(e.data); };
  mr.onstop = finishRec;
  mr.start(1000);
  document.getElementById("ccomp").classList.add("recording");
  const send = document.getElementById("csend");
  send.textContent = "Send"; send.dataset.chat = "recsend"; send.classList.remove("stop");
  const tick = () => {
    const s = Math.floor((Date.now() - rec.t0) / 1000), el = document.getElementById("crec-t");
    if (el) el.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
    if (s >= REC_MAX_S) stopRec(true);
  };
  rec.timer = setInterval(tick, 250); tick(); haptic();
}

  if (!rec || rec.mr.state === "inactive") return;
  rec.send = send; clearInterval(rec.timer); rec.mr.stop();
}
async function finishRec() {
  const r = rec; rec = null;
  if (!r) return;
  r.stream.getTracks().forEach(t => t.stop());
  const comp = document.getElementById("ccomp");
  if (comp) comp.classList.remove("recording");
  const send = document.getElementById("csend");
  if (send) { send.textContent = "Send"; send.dataset.chat = "send"; }
  if (!r.send || chat !== r.chat) return;
  if (Date.now() - r.t0 < 800) { toast("Too short, nothing sent"); return; }
  const c = chat, blob = new Blob(r.chunks, {type: (r.mr.mimeType || "audio/mp4").split(";")[0]});

  try {
    const res = await fetch(base + "api/chat/voice?" + qs, {method: "POST", body: blob,
      headers: {"x-init-data": initData, "content-type": blob.type || "audio/mp4"}});
    const j = await res.json().catch(() => ({}));
    if (res.status === 403 && !inTg) { location.href = base + "login"; return; }
    if (!res.ok) throw new Error(j.error || res.status);
    c.first = false;
    const mine = (j.messages || []).map((m, i) => m.role === "you" ? i : -1).filter(i => i >= 0);

// The clipboard API, with a selected textarea and execCommand where it is refused (iOS home-screen app, Telegram).
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) {}
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly", ""); ta.style.cssText = "position:fixed;top:0;left:0;opacity:0;font-size:16px";
  document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0, text.length);

  ta.remove(); return ok;
}

// A card that leaves fades out where it was (Nov 9, QA Nov 8 item 5) instead of the list
// re-laying at once: a copy of it, drawn over the page and never tappable, while the rest slides.
function ghost(el) {
  if (!el.classList || !el.classList.contains("item") || !document.body.animate) return;
  const r = el.getBoundingClientRect();
  if (!r.height || r.bottom < 0 || r.top > window.innerHeight) return;
  const g = el.cloneNode(true);
  g.removeAttribute("data-id"); g.querySelectorAll("[data-id]").forEach(x => x.removeAttribute("data-id"));
  g.setAttribute("aria-hidden", "true");
  Object.assign(g.style, {position: "absolute", left: r.left + window.scrollX + "px", top: r.top + window.scrollY + "px",
                          width: r.width + "px", height: r.height + "px", margin: "0", pointerEvents: "none", zIndex: "5"});
  document.body.appendChild(g);
  const a = g.animate([{opacity: 1, transform: "none"}, {opacity: 0, transform: "scale(.97)"}],
                      {duration: 260, easing: "cubic-bezier(.4,0,.6,1)"});
  a.onfinish = a.oncancel = () => g.remove();
}
function flip(before, animate) {
  if (!animate || !Element.prototype.animate) return;
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const seen = new Set(), had = Object.keys(before).length;
  document.querySelectorAll("#app [data-id]").forEach(el => {
    const id = el.dataset.id; if (seen.has(id)) return; seen.add(id);
    const top = el.getBoundingClientRect().top;
    if (id in before) {
      const dy = before[id].top - top;
      if (Math.abs(dy) > 1) el.animate([{transform: `translateY(${dy}px)`}, {transform: "none"}],
                                       {duration: 480, easing: "cubic-bezier(.22,.8,.25,1)"});
    } else if (had) {
      el.animate([{opacity: 0, transform: "translateY(8px) scale(.98)"}, {opacity: 1, transform: "none"}],
                 {duration: 360, easing: "cubic-bezier(.22,.8,.3,1)"});
    }
  });
  // Gone: only the outermost card that left, so a card and the rows inside it fade once. A fold
  // closing takes many at once; those just go.
  const gone = Object.values(before).filter(b => !seen.has(b.el.dataset.id));
  const outer = gone.filter(b => !gone.some(o => o !== b && o.el.contains(b.el)));
  if (outer.length <= 3) outer.forEach(b => ghost(b.el));
}

      const asks = d.part_done || [], clr = d.cleared || [], doneN = d.done.length + clr.length;
      // The actual check (Tasks v2, Nov 6): a step far off its estimate asks once.
      const actuals = (d.actual_asks || []).map(a => `<div class="dactual" data-id="${esc(a.task)}" data-sid="${esc(a.step)}">${esc(stripDue(clean(a.text)))} took ${fmt(a.actual)}, estimated ${fmt(a.est)}. It really took: <button class="link" data-actual="shorter">shorter</button> · <button class="link" data-actual="right">about that</button> · <button class="link" data-actual="longer">longer</button></div>`).slice(0, 1).join("");
      const live = Object.keys(flips).filter(k => flips[k].until > Date.now());
      // Asking parts sit where the card was (booked by time, else by his order), rows keep theirs.
      const seq = d.rows.filter(r => !flips[r.id] || flips[r.id].until <= Date.now());
      asks.forEach(a => {
        const k = seq.findIndex(r => a.blk ? (!r.blk || r.blk.s > a.blk.s) : (!r.blk && (r.do_n ?? 0) > (a.do_n ?? 0)));

      });
      const cards = seq.map(r => r.fin ? partAskItem(r) : item(r, "do"));
      live.sort((a, b) => flips[a].idx - flips[b].idx).forEach(k => cards.splice(Math.min(flips[k].idx, cards.length), 0, flipHtml(k)));
      if (cards.length) h += `<div class="list" data-sec="do">${cards.join("")}</div>`;
      else if (clr.length) {

        const fin = clr.filter(x => (x.cleared_state || {}).finished).length, lo = clr.filter(x => !(x.cleared_state || {}).finished && !(x.cleared_state || {}).closed).length;

      const wt = d.waiting || [];

      const wins = todayWins(d.date);
      const lo = d.left_open || [];

      if (openWaitFold && wt.length) h += `<div class="list" style="margin-top:10px">${wt.map(w => `<div class="item dwait" data-id="${esc(w.id)}"><div class="top"><div class="body">
          <div class="title">${esc(w.title)}</div>
          ${editWait === w.id
            ? `<textarea class="in-wait" rows="2" autocomplete="off" enterkeyhint="done" aria-label="Waiting on">${esc(editDraft ?? w.who)}</textarea>`
            : `<div class="wwhy" data-step="wedit">Waiting on ${esc((w.who || "someone").replace(" · for: ", ": "))}</div>`}

      // Cleared (Nov 9): everything off today's list, each row with its true state and Back to today;
      // tasks closed elsewhere today read "Task closed".
      const clLine = x => { const c = x.cleared_state || {}, w = c.waiting || 0, dn = (c.done || 0) - w;
        return c.closed ? "Task closed" : w ? `${dn ? dn + " done · " : ""}${w} waiting`
          : c.total && dn >= c.total ? `${dn} of ${c.total} done` : dn ? `${dn} of ${c.total} done · ${c.total - dn} left open` : "Not started · left open"; };
      if (openDoneFold && doneN) h += `<div class="list dcleared" style="margin-top:10px">${clr.map(x => `<div class="item dcl" data-id="${esc(x.id)}"><div class="top"><div class="body">
          <div class="dtxt dcl-t">${esc(x.title)}</div><div class="dtag dpline">${esc(clLine(x))}</div></div>
          <button class="link dback" data-do="back">Back to today</button></div></div>`).join("")}${d.done.map(x => `<div class="item dcl" data-id="${esc(x.id)}"><div class="top"><div class="body">
          <div class="dtxt dcl-t">${esc(x.title)}</div><div class="dtag dpline">Task closed</div></div></div></div>`).join("")}</div>`;
    }
  } else if (tab === "chat") {   // the Chat tab (Nov 8)
    h += chatTabHtml();
  } else if (tab === "goals") {   // goals.js (Nov 5): the week against his goals
    h += window.goalsHtml ? goalsHtml() : head("Loading…", "Goals");
  } else if (tab === "more") {

  } else if (tab === "open") {

  } else if (tab === "replies") {

    h += replyUndoLine();

  } else if (tab === "train") {
    // Train (Nov 8, split out of the Claude tab): everything he rates to teach Carmen, today's
    // chunks and the steps to sharpen (the golden sets), and the backfill's proposals to judge.
    const tc = trainCount();
    h += head(`${tc ? tc + " to rate" : "Nothing to rate"} · teaches the estimates and steps · ${refreshLink()}`, "Train");
    const grouped = new Set();
    h += chunkList(grouped);
    h += reviewList(grouped);
    // The step cleanup (Tasks v2 slice 7): the backfill's proposal per task, his to apply or skip.
    const olds = (view.cleanup || []).filter(c => c.old).sort((a, b) => (b.captured || "").localeCompare(a.captured || "")), cl = (view.cleanup || []).filter(c => !c.old);
    if (olds.length) h += `<h2>Old tasks: still relevant? <span>${olds.length}</span></h2>` + olds.map(c => `<div class="item dclean" data-id="${esc(c.task)}"><div class="top"><div class="body">
      <div class="title">${esc(c.task)}</div><div class="nx">${c.captured ? "captured " + esc(sinceLabel(c.captured)) + " · " : ""}nothing done on it since</div>
      ${c.before ? `<div class="dunclear">${esc(stripDue(clean((c.before.split("\n").find(l => /Next:/.test(l)) || c.before.split("\n")[0]).replace(/^\s*- \[ \] (?:Next|Then): /, ""))))}</div>` : ""}</div>
      <div class="pair"><button class="addpill txt on" data-old="keep">Keep</button><button class="addpill txt ghost" data-old="done">Close</button></div></div>
      <div class="fbacts"><button class="link" data-old="notatask">Not a task</button></div></div>`).join("");
    if (cl.length) h += `<h2>Step cleanup · ${cl.length} task${cl.length > 1 ? "s" : ""}</h2>` + cl.map(c => `<div class="item dclean" data-id="${esc(c.task)}"><div class="top"><div class="body">
      <div class="title">${esc(c.task)}</div>${(c.why || []).length ? `<div class="nx">${esc(c.why.join(" · "))}</div>` : ""}
      <div class="cldiff"><div><label>Now</label><pre>${esc(c.before)}</pre></div><div><label>Proposed</label><pre>${esc(c.after)}</pre></div></div></div>
      <div class="pair"><button class="addpill txt on" data-clean="apply">Apply</button><button class="addpill txt ghost" data-clean="skip">Skip</button></div></div></div>`).join("");
    if (!tc) h += `<div class="empty">Nothing to rate right now.</div>`;
  } else if (tab === "claude") {
    h += head(`Claude can take these further · you approve each · ${refreshLink()}`, "Claude");
    const tc = trainCount();
    if (tc) h += `<div class="mind">${tc} to rate in <button class="link" data-tab="train">Train</button></div>`;
    const t = view.today, todayIds = new Set([t.one && t.one.id, ...t.needs.map(r => r.id), ...sel.today]);
    const mineToday = view.claude.filter(r => todayIds.has(r.id)), others = view.claude.filter(r => !todayIds.has(r.id));
    if (mineToday.length) h += `<h2>In today's selection <span>${mineToday.length}</span></h2>` + mineToday.map(claudeCard).join("");
    if (others.length) h += (mineToday.length ? `<h2>More Claude can push <span>${others.length}</span></h2>` : "") + others.map(claudeCard).join("");
    if (!view.claude.length) h += `<div class="empty">Nothing for Claude right now.</div>`;
  } else if (tab === "plan") {
    const pd = planDay || day, chosen = selection(pd);
    h += head(esc(dayName(pd)), "Plan");
    h += `<div class="seg" role="tablist"><button data-plan="today" class="${pd === "today" ? "on" : ""}">Today</button>
      <button data-plan="tomorrow" class="${pd === "tomorrow" ? "on" : ""}">Tomorrow</button></div>`;
    // Oct 31, the owner: the tasks open until there is a plan, then folded (unfold to edit and
    // update); under them the day as Claude plans it; under that the chat, each a section.
    const started = planHas(pd), pu = planUi[pd] || (planUi[pd] = {});
    if (pu.folded === undefined) pu.folded = started;
    if (chosen.length) { const keep = day; day = pd; h += budgetBar(); day = keep; }
    h += `<details class="psec ptasks" data-pday="${pd}"${pu.folded ? "" : " open"}><summary><b>Tasks</b><span>${chosen.length} from ToDo${started ? " · Edit" : ""}</span></summary>`;
    h += chosen.length
      ? `<div class="list plist">${chosen.map(r => item(r, "plan")).join("")}</div>
         <button class="cta" id="plan-go" style="background:var(--accent);color:var(--onaccent)">${started ? "Update plan" : "Create plan"}</button>`
      : `<div class="empty">Nothing selected for ${pd}. Pick it in ToDo first.</div>`;
    h += `</details><div id="plan-day-slot"></div>${started ? '<div id="plan-chat-slot"></div>' : ""}`;
  } else {
    h += head("Ask anything, or about any task", "Chat");
    h += `<div class="card soon"><div class="title">Chat in the app</div>Talk on any card opens a chat with Claude about that task.</div>`;
  }
  if (testMode) h += `<div class="foot">Test mode</div>`;   // "Live · app" meant nothing to him (QA Nov 8)
  // A page under More leads back to it (Nov 9).
  if (MORE.some(([k]) => k === tab)) h = h.replace('<div class="head">', '<div class="head"><button class="link mback" data-tab="more">‹ More</button>');
  app.innerHTML = h;
  app.classList.toggle("pl-on", tab === "today");   // Plan's wider laptop page and room for its dock
  app.classList.toggle("pl-tv", tab === "today" && (planUi[day] || {}).pv === "times");
  if (tab === "today") { mountPlan(day); plSticky(); planFillOpen(); }
  if (tab === "chat") mountGeneral(); else gui.away = true;
  // Open cards stay open across the auto-refresh redraws (they closed every 20 s on the phone).
  app.querySelectorAll("[data-id]").forEach(c => { if (openIds.has((c.classList.contains("plc") ? "plan:" : "") + c.dataset.id)) c.classList.add("open"); });
  flip(before, animate);
  growDrafts();
  uiSave();
}

async function load(first) {
  try {
    const next = await api("api/view" + (first ? "?open=1" : ""));
    const same = !first && lastJson === JSON.stringify(next);
    view = next; lastJson = JSON.stringify(next);
    if (offqLoad().length) setTimeout(offqSend, 0);
    syncSel();
    if (!same) { if (first) render(); else drawSoon(); }
    if (first && view.prerun && view.prerun.running && !polling) watchPrerun(stamp(view));
  } catch (e) {
    if (!view) document.getElementById("app").innerHTML = `<div class="empty">Could not load: ${esc(e.message)}</div>`;
  }
}

// While an update runs: reload every 10 s, stop when it ends, say whether it worked.
const stamp = v => (v && v.generated || "") + "|" + (v && v.updated || "");
function watchPrerun(before) {
  clearInterval(polling);
  load().then(() => drawSoon());
  polling = setInterval(async () => {
    await load();
    if (view && view.prerun && !view.prerun.running) {
      clearInterval(polling); polling = null;
      toast(view.prerun.last_ok && stamp(view) !== before ? "Updated"
                                                           : "Update failed, the data is unchanged");
    }
  }, 10000);
}

// Refresh reruns the pre-run: new mail, WhatsApp, calendar and the latest meditation.
async function refresh() {
  if (view && view.prerun && view.prerun.running) return;
  try {
    const res = await api("api/act", {action: "meditation"});
    haptic(); toast(res.msg);
    if (res.running) { view.prerun = {running: true}; render(); watchPrerun(stamp(view)); }
  } catch (e) { toast("Refresh failed: " + e.message); }
}

// Pull down hard at the top to refresh, as on any iPhone list (owner decision, Oct 31).
const ptr = document.createElement("div");
ptr.id = "ptr"; ptr.innerHTML = "<span>Pull to refresh</span>"; document.body.appendChild(ptr);
const PULL = 90;
let pull = null;
document.addEventListener("touchstart", (e) => {
  pull = null;
  if (window.scrollY > 0 || busy() || document.body.style.position === "fixed" || !e.touches[0]) return;
  pull = {x: e.touches[0].clientX, y: e.touches[0].clientY, d: 0};
}, {passive: true});
document.addEventListener("touchmove", (e) => {
  if (!pull) return;
  const dx = e.touches[0].clientX - pull.x, dy = e.touches[0].clientY - pull.y;
  if (dy <= 0 || Math.abs(dx) > dy) { pull.d = 0; ptr.style.opacity = 0; return; }
  pull.d = dy * 0.5;
  const running = view && view.prerun && view.prerun.running;
  ptr.style.opacity = Math.min(1, pull.d / PULL);
  ptr.style.transform = `translateY(${Math.min(pull.d, PULL) - 20}px)`;
  ptr.classList.toggle("ready", pull.d >= PULL);
  ptr.firstChild.textContent = running ? "Already updating…" : pull.d >= PULL ? "Release to refresh" : "Pull to refresh";
}, {passive: true});
document.addEventListener("touchend", () => {
  if (!pull) return;
  const go = pull.d >= PULL; pull = null;
  ptr.style.transition = "opacity .25s, transform .25s"; ptr.style.opacity = 0; ptr.style.transform = "";
  setTimeout(() => { ptr.style.transition = ""; }, 260);
  if (go) refresh();
});

function busy() {
  const a = document.activeElement;
  return (a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA")) || popCard || document.querySelector(".editing");
}
// Swipe on the phone (owner decision, Oct 30): right = Add (or take out again), left = Remove.
// Only a clearly horizontal drag counts, so scrolling never triggers anything.
let sw = null;
document.addEventListener("touchstart", (e) => {
  const row = e.target.closest(".item");
  if (!row || e.target.closest("button, input, textarea") || !row.querySelector('[data-a="select"], [data-a="unselect"]')) return;
  const t = e.touches[0];
  sw = {row, x: t.clientX, y: t.clientY, dx: 0, on: false};
}, {passive: true});
document.addEventListener("touchmove", (e) => {
  if (!sw) return;
  const t = e.touches[0], dx = t.clientX - sw.x, dy = t.clientY - sw.y;
  if (!sw.on) {
    if (Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy) * 1.5) sw.on = true;
    else { if (Math.abs(dy) > 12) sw = null; return; }
  }
  e.preventDefault();
  sw.row.style.transition = "none";   // the row follows the finger 1:1, no easing lag
  sw.dx = dx;
  sw.row.style.transform = `translateX(${dx}px)`;
  sw.row.classList.toggle("sw-add", dx > 0);
  sw.row.classList.toggle("sw-rem", dx < 0);
  sw.row.classList.toggle("sw-go", Math.abs(dx) > 80);
}, {passive: false});
document.addEventListener("touchend", () => {
  if (!sw) return;
  const {row, dx, on} = sw; sw = null;
  row.style.transition = "transform .2s"; row.style.transform = "";
  setTimeout(() => {
    row.style.transition = ""; row.classList.remove("sw-add", "sw-rem", "sw-go");
    if (!on) return;
    const b = dx > 80 ? row.querySelector('[data-a="select"], [data-a="unselect"]')
            : dx < -80 ? row.querySelector('[data-a="removeopen"]') : null;
    if (b) b.click();
  }, 200);
});

async function pollPending() {

  if (document.hidden || ap.busy) return;

    ${p.why ? `<div class="why">${esc(p.why)}</div>` : ""}

async function chatOp(cBtn, t) {
  const op = cBtn.dataset.chat, c = chat;
  if (op === "close") { closePop(); lastJson = null; if (!testMode) load(); else render(); return; }
  if (op === "jump") {   // Steps / Chat on the phone (round 3)
    const box = document.getElementById("cmsgs");
    if (box) { const toChat = cBtn.textContent === "Chat"; box.scrollTop = toChat ? box.scrollHeight : 0; cBtn.textContent = toChat ? "Steps" : "Chat"; }
    return;
  }
  if (op === "dayfold") { document.getElementById("cday").classList.toggle("min"); return; }
  if (op === "send") { sendChat(); return; }
  if (op === "book") {   // the Book tap (Nov 10, Tier 1.3): its own request, never chat text; the outcome comes back from the calendar
    if (c.busy || c.kind !== "plan") return;
    c.st = Object.assign({}, c.st || {}, {busy: true, book: {status: "booking"}}); paintSheet();
    try { const st = await api("api/chat", {op: "book", kind: "plan", id: "", day: c.day, tab: "plan", from: "plan"}); if (chat === c) paintChat(st); }
    catch (e) { toast("Failed to book: " + e.message); if (chat === c) pollChat(); }
    return;
  }
  if (op === "mic") { ttsStop(); startRec(); return; }
  if (op === "speak") { const i = +cBtn.dataset.i; if (tts.idx && tts.idx.includes(i)) { ttsStop(); return; } ttsUnlock(); ttsPlay(c, [i]); return; }
  if (op === "img") { pickImages(); return; }
  if (op === "imgdrop") { (c.images || []).splice(+cBtn.dataset.n, 1); paintThumbs(); return; }
  if (op === "recsend") { ttsUnlock(); stopRec(true); return; }
  if (op === "reccancel") { stopRec(false); return; }
  if (op === "stop") { try { paintChat(await api("api/chat", {op: "stop", kind: c.kind, id: c.id, day: c.day})); } catch (e) { toast("Failed: " + e.message); } return; }

// The DoD, the proposed rewrites and the steps, on the Do card and in the Start panel (Nov 1).
async function taskOp(el) {
  const holder = el.closest("[data-id]"), id = holder && holder.dataset.id, op = el.dataset.tp, r = id && doRow(id);
  if (!r) return;
  const d = r.detail || {}, box = el.closest(".tp-dodsec, .ddod, .tp-stepsec");
  if (op === "dodedit" && box) {
    box.innerHTML = `<label>Definition of Done</label><textarea class="in-tp" rows="3" placeholder="What done well looks like: the whole scope, with whom, what well means">${esc(d.dod || "")}</textarea>
      <div class="tp-acts"><button class="link" data-tp="dodsave">Save</button> · <button class="link" data-tp="cancel">Cancel</button></div>`;
    box.querySelector("textarea").focus(); return;
  }
  if (op === "stepsedit" && box) {
    const lines = [clean(r.next)].concat((d.steps || []).map(clean)).filter(Boolean);
    box.innerHTML = `<label>Steps, one per line, the next one first</label><textarea class="in-tp" rows="${Math.max(4, lines.length + 1)}">${esc(lines.join("\n"))}</textarea>
      <div class="tp-acts"><button class="link" data-tp="stepssave">Save</button> · <button class="link" data-tp="cancel">Cancel</button></div>`;
    // The box in view, not the chat's end (Nov 9, QA Nov 8); the focus rule centres it again once the keyboard is up.
    const ta = box.querySelector("textarea"); ta.focus({preventScroll: true}); ta.scrollIntoView({block: "center"}); return;
  }
  if (op === "cancel") { refreshTask(); return; }
  if (op === "trailrev") { const ul = el.closest(".tp-asksec").querySelector(".tp-trail"); if (ul) ul.hidden = !ul.hidden; return; }
  if (op === "trailok" || op === "trailundo") {
    if (op === "trailundo" && !confirm("Put the steps back as they were before Claude's changes today?")) return;
    el.disabled = true;
    try { const res = await api("api/act", {id, action: op === "trailok" ? "trail_ok" : "trail_undo"}); haptic(); if (res.msg) toast(res.msg, true); await load(); refreshTask(); }
    catch (e) { el.disabled = false; toast("Failed: " + e.message); }
    return;
  }
  if (op === "sub") {
    // A part of the Next step: ticked here only; the last one ticks the step itself (step_done).
    const n = +el.dataset.n, parts = stepParts(r.next).length, done = subDone(r), on = !done.has(n);
    on ? done.add(n) : done.delete(n);
    view.subticks = view.subticks || {};
    const sid = (r.detail || {}).next_id || "";
    view.subticks[r.id] = {sid, next: r.next, done: [...done]};
    refreshTask(); haptic();
    try {
      await api("api/act", {id, action: "subtick", next: r.next, sid, n, on});
      lastJson = null;
      if (!(on && done.size >= parts)) load();
      if (on && done.size >= parts) {
        const res = await api("api/act", {id, action: "step_done", tab: "panel"});
        if (sid) toastUndo(res.state === "done" ? "Task closed" : "Step done", async () => { await api("api/act", {id, action: "step_untick", sid}); lastJson = null; await load(); refreshTask(); });
        lastStep = {id, title: r.title, state: res.state, who: res.who || "", next: res.next || "", until: Date.now() + STEP_SHOW_MS};
        await load(); refreshTask();
      }
    } catch (e) { toast("Failed: " + e.message); }
    return;
  }
  if (op === "discard") {
    // The × on a step (Nov 4): struck in the note, never deleted; a discarded Next brings up the next one.
    const s = el.dataset.next ? r.next : (d.steps || [])[+el.dataset.n];
    const sid = (el.dataset.next ? d.next_id : (d.step_ids || [])[+el.dataset.n]) || "";
    if (!s) return;
    el.disabled = true; const li = el.closest("li"); if (li) li.style.opacity = ".3";
    try { const res = await api("api/act", {id, action: "step_discard", text: s, sid}); if (testMode) toast(res.msg); haptic(); await load(); refreshTask(); }
    catch (e) { el.disabled = false; if (li) li.style.opacity = ""; toast("Failed: " + e.message); }
    return;
  }
  if (op === "line") {
    const s = (d.steps || [])[+el.dataset.n], sid = (d.step_ids || [])[+el.dataset.n] || "";
    if (!s) return;
    el.disabled = true;
    try {
      await api("api/act", {id, action: "tick_line", text: s, sid}); haptic(); lastJson = null; await load(); refreshTask();
      if (sid) toastUndo("Step done", async () => { await api("api/act", {id, action: "step_untick", sid}); lastJson = null; await load(); refreshTask(); });
    }
    catch (e) { el.disabled = false; toast("Failed: " + e.message); }
    return;
  }
  const body = {id, action: {dodok: "dod_confirm", dodsave: "dod_set", propok: "prop_accept", propno: "prop_ignore", stepssave: "steps_save"}[op]};
  if (!body.action) return;
  const ta = box && box.querySelector("textarea");
  if (op === "dodsave") { body.text = ta ? ta.value : ""; if (!body.text.trim()) return; }
  if (op === "stepssave") body.steps = (ta ? ta.value : "").split("\n").map(x => x.trim()).filter(Boolean);
  if (op === "propok" || op === "propno") { const x = (r.prop || [])[+el.dataset.i]; if (!x) return; body.old = x.old; body.new = x.new; if (x.field) { body.field = x.field; body.due = x.due || ""; if (x.parts) body.parts = x.parts; if (x.after) body.after = x.after; } }
  el.disabled = true;
  // Saving steps keeps the panel where it was and says so (Nov 9, QA Nov 8: it jumped into the chat).
  const sb = op === "stepssave" && document.getElementById("cmsgs"), keep = sb ? sb.scrollTop : 0;
  const hold = () => { if (sb && sb.isConnected) sb.scrollTop = keep; };
  try {
    const res = await api("api/act", body); haptic();
    if (sb && !testMode) toast("Steps saved", true); else if (res.msg) toast(res.msg);
    await load(); refreshTask();
    if (sb) { hold(); [120, 450].forEach(ms => setTimeout(hold, ms)); }   // and again after the keyboard has gone
  }
  catch (e) { el.disabled = false; toast("Failed: " + e.message); }
}
